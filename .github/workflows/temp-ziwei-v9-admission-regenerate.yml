name: Temporary Zi Wei V9 admission regeneration

on:
  push:
    branches:
      - admit/ziwei-v9-jumen-qisha-context

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admit/ziwei-v9-jumen-qisha-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and regenerate Zi Wei admission artifacts
        run: |
          python references/ziwei/validate_interpretation_claim_registry.py references/ziwei/ziwei_interpretation_claim_registry_star_palace_context_v1.json
          python tools/build_ziwei_star_palace_coverage.py
          python tools/build_ziwei_star_palace_coverage.py --check
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
          python tools/build_chatgpt_load_pack.py
          python tools/build_chatgpt_load_pack.py --check
          python tools/chatgpt_load_benchmark.py --check
          python -m unittest             tests.test_ziwei_star_palace_context             tests.test_ziwei_star_palace_coverage             tests.test_ziwei_star_palace_coverage_routing             tests.test_ziwei_production_contract_v1             tests.test_ziwei_materialization_discoverability             tests.test_ziwei_sihua_admission -v
      - name: Commit generated artifacts and remove bridge
        run: |
          rm .github/workflows/temp-ziwei-v9-admission-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexes/ziwei/star_palace_coverage_v1.json runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json CHATGPT_LOAD_PACK.json .github/workflows/temp-ziwei-v9-admission-regenerate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Zi Wei V9 admission artifacts"
          git push origin HEAD:admit/ziwei-v9-jumen-qisha-context
