name: Zi Wei Calendar Range Artifact

on:
  push:
    branches:
      - zw-p1-003-calendar-range-dataset
    paths:
      - ".github/workflows/ziwei-calendar-range-artifact.yml"
      - "tools/build_ziwei_calendar_interval_dataset.py"
      - "tools/validate_ziwei_calendar_interval_dataset.py"
      - "tests/test_ziwei_calendar_interval_dataset.py"
      - "tools/build_ziwei_tool_bundle.py"
      - "tools/ziwei_calendar_interval_poc.py"
      - "requirements-ziwei-calendar.txt"

permissions:
  contents: read

jobs:
  build-calendar-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Zi Wei calendar dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt
      - name: Run targeted dataset tests
        run: python -m unittest tests.test_ziwei_calendar_interval_dataset
      - name: Build exact candidate product range dataset
        run: |
          python tools/build_ziwei_calendar_interval_dataset.py \
            --output /tmp/ziwei-calendar-v1 \
            --start-year 1900 \
            --end-year 2100
      - name: Validate exact dataset and deterministic rebuild
        run: |
          python tools/validate_ziwei_calendar_interval_dataset.py \
            --root /tmp/ziwei-calendar-v1 \
            --rebuild
      - name: Upload exact generated dataset
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-calendar-range-1900-2100-v2
          path: /tmp/ziwei-calendar-v1
          if-no-files-found: error
          retention-days: 1
