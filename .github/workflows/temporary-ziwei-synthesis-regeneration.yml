name: Temporary Zi Wei bundle regeneration

on:
  push:
    branches: [chatgpt/ziwei-synthesis-brightness-focus]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.repository == 'masini1491/ai-divination-playbook'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned staging base and regenerate canonical derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -r requirements/astrology-provider.txt -r requirements/ziwei-calendar.txt
          python tools/build_ziwei_tool_bundle.py
          python tools/build_chatgpt_load_pack.py
          python tools/build_ziwei_tool_bundle.py --check
          python tools/build_chatgpt_load_pack.py --check
          python -m unittest discover -s tests -v
          python tools/playbook_check.py .
          rm .github/workflows/temporary-ziwei-synthesis-regeneration.yml
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json CHATGPT_LOAD_PACK.json
          git add -u .github/workflows/temporary-ziwei-synthesis-regeneration.yml
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          python -c 'import subprocess; allowed={"runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json","CHATGPT_LOAD_PACK.json",".github/workflows/temporary-ziwei-synthesis-regeneration.yml"}; changed=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()); assert changed.issubset(allowed) and ".github/workflows/temporary-ziwei-synthesis-regeneration.yml" in changed, changed'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate Zi Wei derived transport after focus ranking fix'
          git push origin HEAD:refs/heads/chatgpt/ziwei-synthesis-brightness-focus
