name: TEMP Rebuild Astrology Core Bundle
on:
  pull_request:
    paths:
      - ".github/workflows/temp-rebuild-astrology-core-bundle.yml"
permissions:
  contents: write
concurrency:
  group: ast-p1-130-core-bundle
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ast-p1-130-transit-house-search
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt
      - run: python tools/build_astrology_core_bundle.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Astrology deterministic core bundle"
          git push origin HEAD:feature/ast-p1-130-transit-house-search
