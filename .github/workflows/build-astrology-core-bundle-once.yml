name: One-time build Astrology core bundle

on:
  push:
    branches:
      - feat/astrology-core-materialization

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'Generate Astrology core bundle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/astrology-core-materialization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Astronomy Engine only
        run: python -m pip install --disable-pip-version-check astronomy-engine==2.1.19
      - name: Inspect installed Astronomy Engine identity
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, importlib.util
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(f"blob {len(data)}\\0".encode()+data).hexdigest()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          spec=importlib.util.find_spec("astronomy")
          root=Path(next(iter(spec.submodule_search_locations)))
          dist=importlib.metadata.distribution("astronomy-engine")
          for p in [root/"__init__.py", root/"astronomy.py"]:
              data=p.read_bytes()
              print(p.name, "size", len(data), "blob", blob(data), "sha256", sha(data))
          licenses=[p for p in (dist.files or ()) if Path(str(p)).name.upper()=="LICENSE"]
          for p in licenses:
              q=Path(dist.locate_file(p)); data=q.read_bytes()
              print("LICENSE", str(p), "size", len(data), "blob", blob(data), "sha256", sha(data))
          record=[p for p in (dist.files or ()) if Path(str(p)).name=="RECORD"]
          for p in record:
              q=Path(dist.locate_file(p))
              print("RECORD_PATH",p)
              for line in q.read_text().splitlines():
                  if "astronomy.py" in line or "__init__.py" in line or "LICENSE" in line:
                      print("RECORD",line)
          PY
      - name: Generate deterministic core bundle
        run: python tools/build_astrology_core_bundle.py
      - name: Commit generated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate Astrology core bundle"
          git push
