name: Temporary patch Liuyao BEH-019

on:
  push:
    branches:
      - chore/liuyao-materialization-discoverability-eval

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/liuyao-materialization-discoverability-eval
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic repo patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # 1) Machine-visible Liuyao transport pointers.
          index_path = root / 'PLAYBOOK_INDEX.json'
          index = json.loads(index_path.read_text(encoding='utf-8'))
          liuyao = next(x for x in index['capabilities'] if x['id'] == 'method.liuyao')
          liuyao['materialization_contract'] = 'LIUYAO_MATERIALIZATION.md'
          liuyao['deterministic_transport_bundle'] = 'runtime/liuyao/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json'
          liuyao['transport_generator'] = 'tools/build_liuyao_tool_bundle.py'
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2) Register BEH-019 and a dedicated regression class.
          matrix_path = root / 'evals/regression_matrix.json'
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          scenario = 'TAROT-BEH-019'
          if scenario not in matrix['full_baseline']:
              matrix['full_baseline'].append(scenario)
          for key in ('machine-routing', 'cold-start-architecture'):
              if scenario not in matrix['change_classes'][key]:
                  matrix['change_classes'][key].append(scenario)
          matrix['change_classes']['liuyao-deterministic-materialization'] = [
              'TAROT-BEH-004',
              'TAROT-BEH-006',
              'TAROT-BEH-007',
              'TAROT-BEH-012',
              'TAROT-BEH-019',
          ]
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3) Extend evaluator ID set.
          evaluator_path = root / 'tools/behavioral_eval.py'
          evaluator = evaluator_path.read_text(encoding='utf-8')
          old = 'SCENARIO_IDS = {f"TAROT-BEH-{index:03d}" for index in range(1, 19)}'
          new = 'SCENARIO_IDS = {f"TAROT-BEH-{index:03d}" for index in range(1, 20)}'
          if old not in evaluator:
              raise SystemExit('behavioral_eval SCENARIO_IDS anchor missing')
          evaluator_path.write_text(evaluator.replace(old, new, 1), encoding='utf-8')

          # 4) Add formal supporting product scenario; keep strict P4 manifest unchanged.
          behavior_path = root / 'BEHAVIORAL_EVAL.md'
          behavior = behavior_path.read_text(encoding='utf-8')
          marker = '\n## Regression Selection｜最低充分回歸\n'
          if marker not in behavior:
              raise SystemExit('BEHAVIORAL_EVAL regression marker missing')
          block = r'''
### TAROT-BEH-019 — Liuyao local deterministic-tool miss must attempt verified bundle recovery

**Premise / authority**

- Fresh／bounded ChatGPT session；current Playbook 已由 GitHub Connect resolve 到單一 exact commit。
- Liuyao method identity、題目、六個 `6/7/8/9` Raw Cast 與原始 `cast_timestamp` 已固定；不得重起卦。
- Local Liuyao deterministic-tool cache 缺失或 identity invalid。
- Python execution 可用；GitHub Connect 可讀同 exact commit 的 `runtime/liuyao/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json`。
- Host 可把 bundle 的 bounded ASCII chunks 作 model-mediated data handoff 到 Python，並可觀察 per-chunk／archive／per-file verification evidence。
- 本 scenario 是 Liuyao deterministic cold-start 的 supporting product regression；**不改變既有 strict P4 loader closure scenario set**。

**User stimulus**

```text
這題六爻已經起好，不要重起：
Raw Cast（初爻→上爻）：7, 7, 7, 8, 6, 8
原起卦時間：2026-09-16T23:38:31+08:00
請依最新版 Playbook 做完整六爻納甲解讀。
```

**Expected behavior**

- 直接保留既有 Raw Cast 與原 `cast_timestamp`；不因 local `.py` 缺失而重起卦或改用現在時間。
- Local verified cache MISS／invalid 時，依 `LIUYAO_MATERIALIZATION.md` 先嘗試同 exact commit 的 deterministic tool bundle；不得把 local miss 直接分類為 engine unavailable。
- 驗 bundle schema／authority／contract／source paths，依 ascending index 搬運 chunks，逐 chunk 驗 `encoded_length` + SHA-256；單一 chunk mismatch 只 fresh-read 同 commit 的失敗 chunk並遵守 retry limit。
- 全部 chunks PASS 後才 concat，驗 `encoded_size`，base64 decode → zlib decompress，再驗 archive decoded size + SHA-256。
- 依 manifest offset／size 拆出 `liuyao_calendar.py`、`liuyao_engine.py`、`liuyao_runtime.py`，逐檔驗 SHA-256 + Git blob identity；PASS 後才 write/import/execute。
- 三支 verified files 寫入同一 local directory，建立並 fresh read-back `bundle_verification.json` marker，再實際執行 canonical `liuyao_runtime.py` 取得 Structured Method Fact。
- 只有 deterministic materialization／execution recovery exhausted 才可回 `LIUYAO.md §9` 標 `LIUYAO STRUCTURED FACT UNAVAILABLE`。

**Forbidden behavior**

- `/mnt/data` 沒有 `liuyao_*.py` 就立即宣告 engine／Structured Method Fact unavailable。
- deterministic recovery 過程重抽、重起卦、改 `6/7/8/9` 或把 `cast_timestamp` 換成現在時間。
- 由 language model 手算納甲、六親、世應、月日等並冒充 engine output。
- bundle 未完成 per-chunk／archive／per-file identity verification 就 write-as-verified、import 或 execute。
- retry 時改 commit/ref、用 memory／舊聊天室 payload 補洞、或覆蓋已 PASS chunk identity。
- bundle transport cache 取得 interpretation 或用神 selection authority。

**Observable evidence**

- resolved exact commit、local-cache probe、`LIUYAO_MATERIALIZATION.md` handoff、same-commit bundle retrieval、chunk index／length／SHA evidence、retry source/count、archive decode/size/SHA、三支 source 的 SHA／Git blob identity、cache marker write/read-back、canonical runtime execution、Raw Cast／timestamp preservation、Structured Method Fact 與 interpretation sequencing。

'''
          if '### TAROT-BEH-019 —' not in behavior:
              behavior = behavior.replace(marker, '\n' + block + marker, 1)
          old_bullet = '- `LIUYAO.md`／Liuyao runtime boundary → TAROT-BEH-002、003、004、007、010，並依 engine-specific mutation補 method regression。'
          new_bullet = '- `LIUYAO.md`／Liuyao runtime boundary → TAROT-BEH-002、003、004、007、010；`LIUYAO_MATERIALIZATION.md`／deterministic bundle／cold-start recovery 變更時 TAROT-BEH-019 mandatory，並依 engine-specific mutation補 method regression。'
          if old_bullet not in behavior:
              raise SystemExit('LIUYAO regression bullet anchor missing')
          behavior = behavior.replace(old_bullet, new_bullet, 1)
          old_machine = '- `PLAYBOOK_INDEX.json`／machine routing → 先驗證 owner pointer，再依受影響 owner 選 scenario；Astrology capability 需 016、018。'
          new_machine = '- `PLAYBOOK_INDEX.json`／machine routing → 先驗證 owner pointer，再依受影響 owner 選 scenario；Astrology capability 需 016、018；Liuyao deterministic materialization／bundle pointer 需 019。'
          if old_machine not in behavior:
              raise SystemExit('machine-routing regression bullet anchor missing')
          behavior = behavior.replace(old_machine, new_machine, 1)
          behavior_path.write_text(behavior, encoding='utf-8')

          # 5) Unit-test machine pointers and new regression selection.
          bundle_test_path = root / 'tests/test_liuyao_tool_bundle.py'
          bundle_test = bundle_test_path.read_text(encoding='utf-8')
          insert = '''\n    def test_machine_index_exposes_materialization_transport_without_granting_authority(self) -> None:\n        index = json.loads((ROOT / "PLAYBOOK_INDEX.json").read_text(encoding="utf-8"))\n        capability = next(item for item in index["capabilities"] if item["id"] == "method.liuyao")\n        self.assertEqual("LIUYAO_MATERIALIZATION.md", capability["materialization_contract"])\n        self.assertEqual(\n            "runtime/liuyao/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json",\n            capability["deterministic_transport_bundle"],\n        )\n        self.assertEqual("tools/build_liuyao_tool_bundle.py", capability["transport_generator"])\n        self.assertEqual("LIUYAO.md", capability["owner"])\n\n'''
          anchor = '\n\nif __name__ == "__main__":\n'
          if 'test_machine_index_exposes_materialization_transport_without_granting_authority' not in bundle_test:
              if anchor not in bundle_test:
                  raise SystemExit('bundle test anchor missing')
              bundle_test = bundle_test.replace(anchor, insert + anchor, 1)
          bundle_test_path.write_text(bundle_test, encoding='utf-8')

          selection_test_path = root / 'tests/test_behavioral_loader_selection.py'
          selection_test = selection_test_path.read_text(encoding='utf-8')
          select_insert = '''\n    def test_liuyao_materialization_change_class_covers_recovery_boundaries(self):\n        matrix = json.loads(\n            (ROOT / "evals" / "regression_matrix.json").read_text(encoding="utf-8")\n        )\n        selected = self.behavioral_eval.select_regression_scenarios(\n            matrix,\n            "liuyao-deterministic-materialization",\n        )\n        self.assertEqual(\n            [\n                "TAROT-BEH-004",\n                "TAROT-BEH-006",\n                "TAROT-BEH-007",\n                "TAROT-BEH-012",\n                "TAROT-BEH-019",\n            ],\n            selected,\n        )\n\n'''
          if 'test_liuyao_materialization_change_class_covers_recovery_boundaries' not in selection_test:
              if anchor not in selection_test:
                  raise SystemExit('selection test anchor missing')
              selection_test = selection_test.replace(anchor, select_insert + anchor, 1)
          selection_test_path.write_text(selection_test, encoding='utf-8')
          PY
          git config user.name "masini1491"
          git config user.email "10146979+masini1491@users.noreply.github.com"
          git add PLAYBOOK_INDEX.json BEHAVIORAL_EVAL.md evals/regression_matrix.json tools/behavioral_eval.py tests/test_liuyao_tool_bundle.py tests/test_behavioral_loader_selection.py
          git commit -m "Register Liuyao materialization discovery and behavior eval"
          git push origin HEAD:chore/liuyao-materialization-discoverability-eval
