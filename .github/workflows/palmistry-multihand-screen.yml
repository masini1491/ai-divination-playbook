name: Palmistry Multi-hand Fixture Screen (Ephemeral)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MediaPipe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1'
      - name: Screen detector-friendly two-palm fixture
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          import cv2
          import mediapipe as mp
          import numpy as np

          MODEL_URL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
          IMAGE_URL='https://upload.wikimedia.org/wikipedia/commons/8/82/Givinghandsandredpushpin.jpg'
          PAGE='https://commons.wikimedia.org/wiki/File:Givinghandsandredpushpin.jpg'

          def fetch(url,dst):
              req=urllib.request.Request(url,headers={'User-Agent':'ai-divination-playbook-palmistry-research/1.0'})
              h=hashlib.sha256()
              with urllib.request.urlopen(req,timeout=60) as r,open(dst,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b); h.update(b)
              return h.hexdigest()

          model=Path('hand_landmarker.task'); model_sha=fetch(MODEL_URL,model)
          image=Path('givinghands.jpg'); image_sha=fetch(IMAGE_URL,image)
          img=cv2.imread(str(image),cv2.IMREAD_COLOR)
          if img is None: raise RuntimeError('image decode failed')
          h,w=img.shape[:2]
          if max(h,w)>1600:
              s=1600/float(max(h,w)); img=cv2.resize(img,(round(w*s),round(h*s)),interpolation=cv2.INTER_AREA)
          options=mp.tasks.vision.HandLandmarkerOptions(
              base_options=mp.tasks.BaseOptions(model_asset_path=str(model)),
              running_mode=mp.tasks.vision.RunningMode.IMAGE,
              num_hands=4,
              min_hand_detection_confidence=0.5,
              min_hand_presence_confidence=0.5,
              min_tracking_confidence=0.5,
          )
          with mp.tasks.vision.HandLandmarker.create_from_options(options) as lm:
              rgb=cv2.cvtColor(img,cv2.COLOR_BGR2RGB)
              result=lm.detect(mp.Image(image_format=mp.ImageFormat.SRGB,data=np.ascontiguousarray(rgb)))
              hands=[]
              for i,lms in enumerate(result.hand_landmarks):
                  xs=[float(p.x) for p in lms]; ys=[float(p.y) for p in lms]
                  handed=None; score=None
                  if i<len(result.handedness) and result.handedness[i]:
                      handed=getattr(result.handedness[i][0],'category_name',None)
                      score=float(getattr(result.handedness[i][0],'score',0.0))
                  hands.append({'index':i,'handedness':handed,'handedness_score':score,'bbox_area_normalized':(max(xs)-min(xs))*(max(ys)-min(ys))})
          print('=== MULTIHAND_SCREEN_JSON ===')
          print(json.dumps({
              'page':PAGE,
              'license':'CC BY 2.0',
              'image_sha256':image_sha,
              'model_sha256':model_sha,
              'mediapipe_version':mp.__version__,
              'working_shape_h_w':list(img.shape[:2]),
              'candidate_count':len(hands),
              'hands':hands,
          },indent=2))
          PY
