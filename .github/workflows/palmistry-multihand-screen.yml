name: Palmistry Multi-hand Fixture Screen (Ephemeral)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MediaPipe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1'
      - name: Screen public multi-palm fixtures
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          import cv2
          import mediapipe as mp
          import numpy as np

          MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
          CANDIDATES = [
              {
                  'id': 'mehndi_hands',
                  'url': 'https://upload.wikimedia.org/wikipedia/commons/a/ac/Mehndi_hands.jpg',
                  'page': 'https://commons.wikimedia.org/wiki/File:Mehndi_hands.jpg',
                  'license': 'CC BY-SA 2.0',
              },
              {
                  'id': 'bilateral_palmar_crease',
                  'url': 'https://upload.wikimedia.org/wikipedia/commons/2/2b/25.12.2018_Vierfingerfurche%2C_beidseitig.JPG',
                  'page': 'https://commons.wikimedia.org/wiki/File:25.12.2018_Vierfingerfurche,_beidseitig.JPG',
                  'license': 'CC BY-SA 4.0',
                  'privacy_note': 'source contains camera-location metadata; location values are intentionally not collected',
              },
          ]

          def fetch(url, dst):
              req = urllib.request.Request(url, headers={'User-Agent':'ai-divination-playbook-palmistry-research/1.0'})
              h = hashlib.sha256()
              with urllib.request.urlopen(req, timeout=60) as r, open(dst, 'wb') as f:
                  while True:
                      b = r.read(1024 * 1024)
                      if not b: break
                      f.write(b); h.update(b)
              return h.hexdigest()

          def resize(img, max_dim=1600):
              h, w = img.shape[:2]
              if max(h,w) <= max_dim: return img
              s = max_dim / float(max(h,w))
              return cv2.resize(img, (round(w*s), round(h*s)), interpolation=cv2.INTER_AREA)

          model = Path('hand_landmarker.task')
          model_sha = fetch(MODEL_URL, model)
          options = mp.tasks.vision.HandLandmarkerOptions(
              base_options=mp.tasks.BaseOptions(model_asset_path=str(model)),
              running_mode=mp.tasks.vision.RunningMode.IMAGE,
              num_hands=4,
              min_hand_detection_confidence=0.5,
              min_hand_presence_confidence=0.5,
              min_tracking_confidence=0.5,
          )
          summary = {'model_sha256': model_sha, 'mediapipe_version': mp.__version__, 'candidates': []}
          with mp.tasks.vision.HandLandmarker.create_from_options(options) as lm:
              for item in CANDIDATES:
                  path = Path(item['id'] + '.img')
                  try:
                      sha = fetch(item['url'], path)
                      img = cv2.imread(str(path), cv2.IMREAD_COLOR)
                      if img is None:
                          summary['candidates'].append({k:v for k,v in item.items() if k != 'url'} | {'sha256': sha, 'decode_error': True})
                          continue
                      work = resize(img)
                      rgb = cv2.cvtColor(work, cv2.COLOR_BGR2RGB)
                      result = lm.detect(mp.Image(image_format=mp.ImageFormat.SRGB, data=np.ascontiguousarray(rgb)))
                      hands = []
                      for i, lms in enumerate(result.hand_landmarks):
                          xs=[float(p.x) for p in lms]; ys=[float(p.y) for p in lms]
                          bbox=max(0,max(xs)-min(xs))*max(0,max(ys)-min(ys))
                          handed=None
                          score=None
                          if i < len(result.handedness) and result.handedness[i]:
                              handed=getattr(result.handedness[i][0], 'category_name', None)
                              score=float(getattr(result.handedness[i][0], 'score', 0.0))
                          hands.append({'index':i,'handedness':handed,'handedness_score':score,'bbox_area_normalized':bbox})
                      clean = {k:v for k,v in item.items() if k != 'url'}
                      summary['candidates'].append(clean | {
                          'sha256': sha,
                          'source_shape_h_w': list(img.shape[:2]),
                          'working_shape_h_w': list(work.shape[:2]),
                          'candidate_count': len(hands),
                          'hands': hands,
                      })
                  except Exception as exc:
                      clean = {k:v for k,v in item.items() if k != 'url'}
                      summary['candidates'].append(clean | {'error': type(exc).__name__ + ': ' + str(exc)})
                  finally:
                      path.unlink(missing_ok=True)
          model.unlink(missing_ok=True)
          print('=== MULTIHAND_SCREEN_JSON ===')
          print(json.dumps(summary, indent=2))
          PY
