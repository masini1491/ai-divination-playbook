name: Temporary Zi Wei V8 coverage regeneration

on:
  push:
    branches:
      - research/ziwei-v8-admission-candidate-review

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ziwei-v8-admission-candidate-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate coverage index
        run: |
          python tools/build_ziwei_star_palace_coverage.py
          python tools/build_ziwei_star_palace_coverage.py --check
          python -m unittest tests.test_ziwei_star_palace_coverage tests.test_ziwei_star_palace_coverage_routing -v
      - name: Refresh load pack
        run: |
          python tools/build_chatgpt_load_pack.py
          python tools/build_chatgpt_load_pack.py --check
          python tools/chatgpt_load_benchmark.py --check
      - name: Commit generated artifacts and remove bridge
        run: |
          rm .github/workflows/temp-ziwei-v8-coverage-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexes/ziwei/star_palace_coverage_v1.json CHATGPT_LOAD_PACK.json .github/workflows/temp-ziwei-v8-coverage-regenerate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Zi Wei V8 coverage artifacts"
          git push origin HEAD:research/ziwei-v8-admission-candidate-review
