name: TEMP Regenerate Astrology Core Bundle AST-P1-190

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-ast-p1-190-regenerate.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'feature/ast-p1-190-shared-civil-time-normalizer'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ast-p1-190-shared-civil-time-normalizer
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Astrology provider dependency
        run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt

      - name: Regenerate and verify Astrology core bundle
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_astrology_core_bundle.py
          python tools/build_astrology_core_bundle.py --check
          python -m unittest discover -s tests -p 'test_civil_time_normalizer.py' -v
          python -m unittest discover -s tests -p 'test_astrology_provider.py' -v
          python -m unittest discover -s tests -p 'test_astrology_core_tool_bundle.py' -v

      - name: Commit generated bundle and remove temporary bridge
        shell: bash
        run: |
          set -euo pipefail
          rm ".github/workflows/temp-ast-p1-190-regenerate.yml"
          git config user.name "masini1491"
          git config user.email "10146979+masini1491@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json ".github/workflows/temp-ast-p1-190-regenerate.yml"
          git commit -m "Regenerate Astrology core bundle for AST-P1-190"
          git push origin HEAD:feature/ast-p1-190-shared-civil-time-normalizer
