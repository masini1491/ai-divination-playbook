name: Astrology Place Split Shard POC

on:
  pull_request:
    paths:
      - "tools/astrology_place_split_shard_benchmark.py"
      - ".github/workflows/astrology-place-split-shard-poc.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact admitted resolver dependency
        run: python -m pip install --disable-pip-version-check "geonamescache==3.0.2"

      - name: Benchmark split alias and candidate shards
        run: |
          python tools/astrology_place_split_shard_benchmark.py \
            --alias-hex-chars 3 \
            --candidate-hex-chars 2 3 4 \
            --output astrology-place-split-shard-benchmark.json \
            > /dev/null

      - name: Print bounded comparison summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("astrology-place-split-shard-benchmark.json").read_text())
          print("status", report["status"])
          for item in report["dataset_identity"]:
              print(
                  "dataset",
                  item["profile"],
                  "identity_match=" + str(item["identity_match"]),
                  "bytes=" + str(item["actual_bytes"]),
                  "sha256=" + item["actual_sha256"],
              )

          for row in report["inline_3hex_baseline"]:
              print(
                  "inline",
                  "profile=" + str(row["profile"]),
                  "total=" + str(row["total_serialized_bytes"]),
                  "p95=" + str(row["p95_shard_bytes"]),
                  "max=" + str(row["max_shard_bytes"]),
                  "files=" + str(row["nonempty_shards"]),
                  "fixture_parity=" + str(row["fixture_parity"]),
              )

          for row in report["split_benchmarks"]:
              print(
                  "split",
                  "profile=" + str(row["profile"]),
                  "alias_hex=" + str(row["alias_hex_chars"]),
                  "candidate_hex=" + str(row["candidate_hex_chars"]),
                  "total=" + str(row["total_serialized_bytes"]),
                  "alias_total=" + str(row["alias_total_serialized_bytes"]),
                  "candidate_total=" + str(row["candidate_total_serialized_bytes"]),
                  "alias_p95=" + str(row["alias_p95_shard_bytes"]),
                  "alias_max=" + str(row["alias_max_shard_bytes"]),
                  "candidate_p95=" + str(row["candidate_p95_shard_bytes"]),
                  "candidate_max=" + str(row["candidate_max_shard_bytes"]),
                  "file_surface=" + str(row["theoretical_file_surface"]),
                  "fixture_parity=" + str(row["fixture_parity"]),
              )
              for fixture in row["fixtures"]:
                  print(
                      "fixture",
                      "profile=" + str(row["profile"]),
                      "candidate_hex=" + str(row["candidate_hex_chars"]),
                      fixture["name"],
                      str(fixture["country_code"]),
                      "alias_bytes=" + str(fixture["alias_shard_bytes"]),
                      "candidate_buckets=" + str(fixture["candidate_bucket_count"]),
                      "candidate_bytes=" + str(fixture["candidate_shard_bytes"]),
                      "total_lookup=" + str(fixture["total_lookup_bytes"]),
                      "matches=" + str(fixture["match_count"]),
                      "parity=" + str(fixture["parity"]),
                  )
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: astrology-place-split-shard-benchmark
          path: astrology-place-split-shard-benchmark.json
          retention-days: 7
