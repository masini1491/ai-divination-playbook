name: Publish Git Sync MCP 1.5.0 Stable (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp-v150-publish-once.yml'
permissions:
  contents: write
  checks: read
concurrency:
  group: git-sync-mcp-v150-one-shot-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'masini1491/ai-divination-playbook' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify pinned Production, checks and tag vacancy; publish
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: '75a894d782546ac2f3e0d384e589d050ac748320'
          SOURCE: '81e53f62017c9ad27d95b964cce2178f98d2fadb'
          TAG: 'git-sync-mcp-v1.5.0'
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'masini1491/ai-divination-playbook'
          relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET...$GITHUB_SHA" --jq .status)"
          test "$relation" = 'ahead' -o "$relation" = 'identical'
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET/check-runs?per_page=100")"
          for context in validate casting-runtime; do
            jq -e --arg context "$context"               '[.check_runs[] | select(.name==$context and .status=="completed" and .conclusion=="success")] | length > 0'               >/dev/null <<< "$checks"
          done
          live="$(curl --fail --silent --show-error --location --max-time 25 https://ai-divination-mcp-git-sync.vercel.app/health)"
          jq -e --arg source "$SOURCE" '.status=="ok" and .source_commit==$source' >/dev/null <<< "$live"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Stable tag already exists. Refuse overwrite."; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Stable release already exists. Refuse overwrite."; exit 1
          fi
          cat > "$RUNNER_TEMP/mcp-v150-notes.md" <<'NOTES'
          ## Git Sync MCP 1.5.0 — Stable

          **Scope:** AI Divination Private – Git Sync MCP only, independent of the whole ai-divination-playbook v0.x release series.

          - Runtime: `1.5.0-policy-first-routing`; routing: `policy-first-v1`; routing authority: `client_canonical_policy_read`.
          - Verified Production deployment commit and stable tag target: `75a894d782546ac2f3e0d384e589d050ac748320` (PR #434).
          - Exact pinned canonical runtime/policy source: `81e53f62017c9ad27d95b964cce2178f98d2fadb` (PR #433).
          - Production endpoint: https://ai-divination-mcp-git-sync.vercel.app
          - Interpretation policy: `canonical-owner-parity-v1`; legacy router `auto-routing-v2` remains callable only for existing clients.
          - New tool entry points: `get_routing_policy` returns the complete SHA-verified `METHOD_ROUTING.md`; `policy_divination`, `policy_plan_batch_chunks`, and `policy_batch_divination` require the client to supply a SHA-bound routing decision.
          - The server rejects invalid identity, method/function mismatches and incomplete Liuyao outcome contracts before any random cast; original casting algorithms, receipt provenance, and three-method allowlist remain unchanged.
          - GitHub Actions run 42578285037 passed both `validate` and `casting-runtime` on the deployment commit.
          - Live ChatGPT plugin acceptance verified 8 advertised tools, full routing manual read (9,147 characters), anonymous nonrandom batch planning and Liuyao contract rejection, and one actual policy-first Liuyao three-coin cast (`cast_completed`) with deterministic structured facts and complete interpretation owner read.

          **Boundaries:** The runtime validates policy integrity and structural route contracts, not ChatGPT's complete semantic adherence or divination accuracy. No automatic recasting, no storage, no exactly-once guarantee, and no lost-response recovery. No Astrology, Zi Wei or Palmistry MCP method admission. Live stochastic Tarot, Meihua and mixed-batch execution are not claimed as newly exercised on this release. Existing Git Sync MCP 1.4.2 Stable and whole-Playbook v0.x releases remain intact.
          NOTES
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases"             -f "tag_name=$TAG" -f "target_commitish=$TARGET"             -f 'name=Git Sync MCP 1.5.0 — Stable'             -f "body=$(cat "$RUNNER_TEMP/mcp-v150-notes.md")"             -F draft=false -F prerelease=false -f make_latest=false             > "$RUNNER_TEMP/mcp-v150-release.json"
          jq -e --arg tag "$TAG" --arg target "$TARGET"             '.tag_name==$tag and .target_commitish==$target and .draft==false and .prerelease==false'             >/dev/null < "$RUNNER_TEMP/mcp-v150-release.json"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$TARGET"
          echo "::notice::Published $TAG targeting $TARGET and verified the exact tag ref."
