name: Temporary rebuild Astrology core bundle

on:
  push:
    branches:
      - fix/astrology-pyswisseph-backend-semantics

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/astrology-pyswisseph-backend-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install astronomy-engine==2.1.19
      - run: python tools/build_astrology_core_bundle.py
      - name: Commit derived bundle and remove bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json
          git rm .github/workflows/temp-rebuild-astrology-core.yml
          git commit -m "Rebuild Astrology deterministic core bundle"
          git push origin HEAD:fix/astrology-pyswisseph-backend-semantics
