name: Astrology derived interpretation targeted regression
on:
  push:
    branches: [astrology-derived-interpretation-admission]
permissions:
  contents: write
jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt
      - run: >-
          python -m unittest
          tests.test_astrology_evidence_selector
          tests.test_astrology_evidence_selector_contract
          tests.test_astrology_interpretation_handoff
          tests.test_astrology_production_contract
      - run: python references/astrology/test_fourth_tenth_house_axis_registry.py
      - shell: bash
        run: |
          rm .github/workflows/astrology-derived-interpretation-test-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/astrology-derived-interpretation-test-once.yml
          git commit -m "Retire derived interpretation test bridge"
          git push origin "HEAD:${{ github.ref_name }}"
