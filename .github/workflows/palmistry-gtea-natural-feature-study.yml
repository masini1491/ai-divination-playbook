name: Palmistry GTEA Natural Feature Study (Ephemeral)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1' 'scipy>=1.15,<2'
      - name: Run bounded natural feature study
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, math, os, sys, urllib.request, xml.etree.ElementTree as ET, zipfile
          from collections import Counter
          from pathlib import Path, PurePosixPath
          import cv2
          import mediapipe as mp
          import numpy as np
          from scipy.stats import mannwhitneyu

          sys.path.insert(0, os.path.abspath('references/palmistry'))
          from association_ambiguity_probe import MODEL_URL, MODEL_SHA256, download, detect_full

          DATA_URL='https://www.dropbox.com/scl/fi/c3t6f2fl420157dnteatl/hand2K_dataset.zip?rlkey=zrxsntio1npottn21gtxcxack&dl=1'
          ARCHIVE_SHA='a64c0fcff572414fa964c5b524e989ffe2e0a6023316bf4554a0f3e24d66fb8b'
          SAMPLE_N=240

          req=urllib.request.Request(DATA_URL,headers={'User-Agent':'ai-divination-playbook-palmistry-research/1.0'})
          h=hashlib.sha256(); buf=io.BytesIO()
          with urllib.request.urlopen(req,timeout=180) as r:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  h.update(b); buf.write(b)
          if h.hexdigest()!=ARCHIVE_SHA: raise RuntimeError('archive sha mismatch')
          buf.seek(0)

          model=Path('hand_landmarker.task')
          if download(MODEL_URL,model)!=MODEL_SHA256: raise RuntimeError('model sha mismatch')

          def norm_label(s): return ' '.join((s or '').replace('_',' ').lower().split())
          def poly(obj):
              return np.array([(float(p.findtext('x')),float(p.findtext('y'))) for p in obj.findall('./polygon/pt')],np.float32)
          def centroid_area(pts):
              area=abs(cv2.contourArea(pts)); m=cv2.moments(pts)
              if m['m00']:
                  c=(m['m10']/m['m00'],m['m01']/m['m00'])
              else: c=tuple(pts.mean(axis=0))
              return c,area
          def decode(z,name):
              im=cv2.imdecode(np.frombuffer(z.read(name),np.uint8),cv2.IMREAD_COLOR)
              if im is None: raise RuntimeError('decode failed '+name)
              return im

          with zipfile.ZipFile(buf) as z:
              names=set(z.namelist()); candidates=[]
              for xn in sorted(n for n in names if n.startswith('GTEA/') and n.endswith('.xml')):
                  root=ET.fromstring(z.read(xn))
                  objs=[o for o in root.findall('./object') if (o.findtext('deleted') or '0')!='1']
                  hands={norm_label(o.findtext('name')):o for o in objs if norm_label(o.findtext('name')) in ('left hand','right hand')}
                  if set(hands)!= {'left hand','right hand'}: continue
                  stem=PurePosixPath(xn).stem; imn=f'GTEA/Images/{stem}.jpg'
                  if imn in names: candidates.append((stem,imn,hands['left hand'],hands['right hand']))
              if len(candidates)<SAMPLE_N: raise RuntimeError(f'only {len(candidates)} candidates')
              idx=np.unique(np.rint(np.linspace(0,len(candidates)-1,SAMPLE_N)).astype(int))
              selected=[candidates[i] for i in idx]

              opts=mp.tasks.vision.HandLandmarkerOptions(
                  base_options=mp.tasks.BaseOptions(model_asset_path=str(model)),
                  running_mode=mp.tasks.vision.RunningMode.IMAGE,num_hands=4,
                  min_hand_detection_confidence=0.5,min_hand_presence_confidence=0.5,min_tracking_confidence=0.5)
              rows=[]
              with mp.tasks.vision.HandLandmarker.create_from_options(opts) as lm:
                  for stem,imn,lo,ro in selected:
                      im=decode(z,imn); H,W=im.shape[:2]; diag=math.hypot(W,H)
                      lp,rp=poly(lo),poly(ro); lc,la=centroid_area(lp); rc,ra=centroid_area(rp)
                      min_area=float(min(la,ra)/(W*H)); mean_area=float((la+ra)/(2*W*H)); area_ratio=float(min(la,ra)/max(la,ra))
                      sep=float(math.hypot(lc[0]-rc[0],lc[1]-rc[1])/diag)
                      mind=float(np.sqrt(((lp[:,None,:]-rp[None,:,:])**2).sum(2)).min()/diag)
                      def bbox(p): return (float(p[:,0].min()),float(p[:,1].min()),float(p[:,0].max()),float(p[:,1].max()))
                      a,b=bbox(lp),bbox(rp); ix=max(0,min(a[2],b[2])-max(a[0],b[0])); iy=max(0,min(a[3],b[3])-max(a[1],b[1])); inter=ix*iy
                      aa=max(0,a[2]-a[0])*max(0,a[3]-a[1]); ba=max(0,b[2]-b[0])*max(0,b[3]-b[1]); biou=float(inter/(aa+ba-inter) if aa+ba-inter else 0)
                      def border(p): return float(min(p[:,0].min(),p[:,1].min(),W-1-p[:,0].max(),H-1-p[:,1].max())/min(W,H))
                      min_border=float(min(border(lp),border(rp)))
                      gray=cv2.cvtColor(im,cv2.COLOR_BGR2GRAY); bright=float(gray.mean()); contrast=float(gray.std()); blur=float(cv2.Laplacian(gray,cv2.CV_64F).var())
                      mask=np.zeros((H,W),np.uint8); cv2.fillPoly(mask,[lp.astype(np.int32),rp.astype(np.int32)],255); hpix=gray[mask>0]
                      hand_bright=float(hpix.mean()); hand_contrast=float(hpix.std())
                      det=detect_full(lm,im); count=int(len(det))
                      rows.append({'stem':stem,'count':count,'min_area_frac':min_area,'mean_area_frac':mean_area,'area_ratio':area_ratio,'centroid_sep_diag':sep,'min_poly_gap_diag':mind,'bbox_iou':biou,'min_border_frac':min_border,'brightness':bright,'contrast':contrast,'blur':blur,'hand_brightness':hand_bright,'hand_contrast':hand_contrast})

          features=['min_area_frac','mean_area_frac','area_ratio','centroid_sep_diag','min_poly_gap_diag','bbox_iou','min_border_frac','brightness','contrast','blur','hand_brightness','hand_contrast']
          retained=[r for r in rows if r['count']>=2]; lost=[r for r in rows if r['count']<2]
          stats=[]
          for f in features:
              a=np.array([r[f] for r in retained],float); b=np.array([r[f] for r in lost],float)
              u,p=mannwhitneyu(a,b,alternative='two-sided'); auc=float(u/(len(a)*len(b)))
              stats.append({'feature':f,'median_retained2':float(np.median(a)),'median_lost':float(np.median(b)),'auc_retained_gt_lost':auc,'p_two_sided':float(p)})
          stats.sort(key=lambda x:x['p_two_sided'])
          dist=Counter(r['count'] for r in rows)
          result={'status':'research-only','archive_sha256':ARCHIVE_SHA,'candidate_pool':int(len(candidates)),'requested_sample_n':SAMPLE_N,'actual_sample_n':int(len(rows)),'sample_rule':'evenly spaced over sorted GTEA XML frames with direct Left hand + Right hand objects','final_candidate_count_distribution':{str(k):int(v) for k,v in sorted(dist.items())},'retained2_n':int(len(retained)),'lost_lt2_n':int(len(lost)),'univariate_stats':stats,'top10_rows_by_smallest_min_hand_area':sorted(rows,key=lambda r:r['min_area_frac'])[:10],'evidence_boundary':'all feature values and detector counts are post-execution observations for this bounded sample; univariate p-values are exploratory and uncorrected; no production threshold follows.'}
          print('=== GTEA_NATURAL_FEATURE_STUDY_JSON ===')
          print(json.dumps(result,indent=2))
          if not retained or not lost: raise RuntimeError('study lacks both retained and lost states')
          PY
