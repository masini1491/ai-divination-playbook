feature/ast-p1-140-transit-house-context|0e3b9d1e0bcb46c1dd9af65cdb445964ed3df004
EOF
)

          TARGETS_B=$(cat <<'EOF'
astrology-e2-live-oracle-probe|48ac20db592dabe0f7106c0775e0c28714e3cc98
research/astrology-exp1-sampled-probe|1e4c8e64d7eec1ec86b0af8e9db4d3d0ba3698eb
research/astrology-exp2-mean-lilith-probe|52fb14b65ce5adfe9a3c0b119e1426f58819c1ee
research/astrology-exp3-osculating-lilith-probe|2a3abfe70788a85db5cb5beb0dfc91ea6050d594
research/astrology-exp4-special-points-probe|13691feef30bb076068961c1f45b29e66f6b4ac5
