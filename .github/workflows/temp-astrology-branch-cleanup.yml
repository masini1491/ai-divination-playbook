feature/ast-p1-130-transit-house-context|f0d613a3f2a3c51d35eab20f6035f220ffe5a6e8
EOF
)

          delete_group() {
            group_name="$1"
            targets="$2"
            echo "== $group_name =="
            while IFS='|' read -r branch expected; do
              [ -n "$branch" ] || continue
              encoded=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["BRANCH"], safe="/"))' BRANCH="$branch")
              ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" 2>/tmp/gherr || true)
              if [ -z "$ref_json" ]; then
                echo "SKIP_MISSING|$branch"
                continue
              fi
              actual=$(printf '%s' "$ref_json" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
              if [ "$actual" != "$expected" ]; then
                echo "DRIFT|$branch|expected=$expected|actual=$actual"
                exit 42
              fi
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
              echo "DELETED|$branch|$actual"
            done <<< "$targets"
          }
          delete_group "A" "$TARGETS_A"
          delete_group "B" "$TARGETS_B"
