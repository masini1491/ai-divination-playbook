    runs-on: ubuntu-latest
    steps:
      - name: Delete admitted Astrology residue branches with exact-SHA preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGETS_A=$(cat <<'EOF'
astrology/reconcile-e8-research-readiness|40dfc465986d64fe0beb1ece46690729937ff106
