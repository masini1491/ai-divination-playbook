name: TEMP Astrology Hygiene Bundle Regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-astrology-hygiene-regenerate.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'maintenance/astrology-recent-change-hygiene-20260927'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/astrology-recent-change-hygiene-20260927
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Astrology provider dependency
        run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt

      - name: Regenerate and verify Astrology core bundle
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_astrology_core_bundle.py
          python tools/build_astrology_core_bundle.py --check
          python -m unittest discover -s tests -p 'test_astrology_interpretation_handoff.py' -v
          python -m unittest discover -s tests -p 'test_astrology_reading_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_astrology_core_tool_bundle.py' -v

      - name: Commit generated bundle and remove temporary bridge
        shell: bash
        run: |
          set -euo pipefail
          rm ".github/workflows/temp-astrology-hygiene-regenerate.yml"
          git config user.name "masini1491"
          git config user.email "10146979+masini1491@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json ".github/workflows/temp-astrology-hygiene-regenerate.yml"
          git commit -m "Regenerate Astrology core bundle after hygiene cleanup"
          git push origin HEAD:maintenance/astrology-recent-change-hygiene-20260927
