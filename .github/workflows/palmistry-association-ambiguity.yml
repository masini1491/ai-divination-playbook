name: Palmistry Association Ambiguity Stress (Ephemeral)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MediaPipe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1'
      - name: Run ambiguity stress
        run: |
          python references/palmistry/association_ambiguity_probe.py --output-dir ambiguity-output
