name: Temporary ChatGPT load-pack regeneration

on:
  push:
    branches:
      - refactor/ziwei-domain-path-normalization

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and verify ChatGPT load pack
        run: |
          python tools/build_chatgpt_load_pack.py
          python tools/build_chatgpt_load_pack.py --check
      - name: Remove temporary workflow and commit generated cache
        run: |
          rm .github/workflows/chatgpt-load-pack-regenerate-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Regenerate ChatGPT load pack"
          git push origin HEAD:${{ github.ref_name }}
