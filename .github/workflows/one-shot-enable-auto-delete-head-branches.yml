name: Clean failed repository-setting bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Remove bridge residue
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$REPO/git/refs/heads/maintenance%2Fenable-auto-delete-head-branches"
          path=".github/workflows/one-shot-enable-auto-delete-head-branches.yml"
          sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/$REPO/contents/$path" -f message="Remove failed repository setting bridge" -f sha="$sha" -f branch="main"
          echo "BRIDGE_RESIDUE_REMOVED"
