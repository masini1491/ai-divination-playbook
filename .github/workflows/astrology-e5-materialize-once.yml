name: Astrology E5 one-time materialization
on:
  push:
    branches: [astrology-e5-aspect-policy-plumbing]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt
      - run: python tools/build_astrology_core_bundle.py
      - run: >-
          python -m unittest
          tests.test_astrology_provider
          tests.test_astrology_production_contract
          tests.test_astrology_core_tool_bundle
          tests.test_astrology_runtime
      - shell: bash
        run: |
          rm .github/workflows/astrology-e5-materialize-once.yml
          python tools/build_astrology_core_bundle.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json .github/workflows/astrology-e5-materialize-once.yml
          git commit -m "Regenerate Astrology core bundle for E5"
          git push origin "HEAD:${{ github.ref_name }}"
