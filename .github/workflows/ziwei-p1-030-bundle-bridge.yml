name: Zi Wei P1-030 Decadal Bundle Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ziwei-p1-030-bundle-bridge.yml"
      - "tools/ziwei_decadal_provider.py"
      - "tools/ziwei_runtime.py"
      - "tools/build_ziwei_tool_bundle.py"
      - "schemas/ziwei/ZIWEI_DYNAMIC_REQUEST_V2.schema.json"
      - "schemas/ziwei/ZIWEI_DYNAMIC_RESULT_V2.schema.json"
      - "ZIWEI_DECADAL_ADMISSION_V1.json"
      - "ZIWEI_PRODUCTION_ADMISSION_V1.json"
      - "tests/test_ziwei_decadal_provider.py"
      - "tests/test_ziwei_decadal_production.py"

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.head_ref == 'zw-p1-030-decadal-calculation-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Zi Wei calendar dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt
      - name: Run P1-030 focused regressions
        run: |
          python -m unittest \
            tests.test_ziwei_decadal_provider \
            tests.test_ziwei_decadal_production \
            tests.test_ziwei_production_contract_v1
      - name: Regenerate deterministic Zi Wei bundle
        run: |
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
      - name: Verify bundle contract
        run: python -m unittest tests.test_ziwei_tool_bundle
      - name: Remove bridge and enforce generated-only diff
        run: |
          rm .github/workflows/ziwei-p1-030-bundle-bridge.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          ).splitlines()
          paths=[line[3:] for line in changed]
          allowed={
              ".github/workflows/ziwei-p1-030-bundle-bridge.yml",
              "runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json",
          }
          unexpected=[p for p in paths if p not in allowed]
          assert not unexpected, unexpected
          assert ".github/workflows/ziwei-p1-030-bundle-bridge.yml" in paths, paths
          assert "runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json" in paths, paths
          PY
      - name: Commit regenerated bundle and remove bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json .github/workflows/ziwei-p1-030-bundle-bridge.yml
          git commit -m "Regenerate Zi Wei bundle for P1-030 decadal"
          git push origin HEAD:${{ github.head_ref }}
