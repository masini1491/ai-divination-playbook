name: Temporary rebuild stochastic probe artifacts

on:
  push:
    branches: [fix/stable-stochastic-post-write-probe]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stable-stochastic-post-write-probe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt
      - name: Rebuild and validate
        run: |
          python tools/build_runtime_capsule.py
          python tools/build_chatgpt_load_pack.py
          python tools/build_runtime_capsule.py --check
          python tools/chatgpt_load_benchmark.py --check
          python tools/validate_loader_ranges.py
          python tools/loader_contract_regression.py
          python -m unittest discover -s tests/casting -v
          python -m unittest discover -s tests -v
          python tools/playbook_check.py .
          git config user.name 'masini1491'
          git config user.email '10146979+masini1491@users.noreply.github.com'
          git rm .github/workflows/tmp-rebuild-stochastic-probe.yml
          git add runtime/casting/CHATGPT_RUNTIME_CAPSULE.json CHATGPT_LOAD_PACK.json
          git commit -am 'Rebuild stochastic probe artifacts'
          git push origin HEAD:fix/stable-stochastic-post-write-probe
