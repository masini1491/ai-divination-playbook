name: Temporary rebuild ChatGPT load pack

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild ChatGPT load pack
        run: python tools/build_chatgpt_load_pack.py
      - name: Commit derived load pack if changed
        run: |
          if git diff --quiet -- CHATGPT_LOAD_PACK.json; then
            echo "Load pack already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHATGPT_LOAD_PACK.json
          git commit -m "Rebuild ChatGPT load pack"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
