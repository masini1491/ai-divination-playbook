name: Publish Git Sync MCP 1.4.2 Stable (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp-v142-publish-once.yml'
permissions:
  contents: write
  checks: read
concurrency:
  group: git-sync-mcp-v142-one-shot-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'masini1491/ai-divination-playbook' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify pinned Production, checks and tag vacancy; publish
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: '3675ff4804bf5edcfbd7e871c2700ef618aadbce'
          SOURCE: 'fcefad4a591490351aef2d4d3edad297a0e9a5b0'
          TAG: 'git-sync-mcp-v1.4.2'
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'masini1491/ai-divination-playbook'
          relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET...$GITHUB_SHA" --jq .status)"
          test "$relation" = 'ahead' -o "$relation" = 'identical'
          checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET/check-runs?per_page=100")"
          for context in validate casting-runtime; do
            jq -e --arg context "$context"               '[.check_runs[] | select(.name==$context and .status=="completed" and .conclusion=="success")] | length > 0'               >/dev/null <<< "$checks"
          done
          live="$(curl --fail --silent --show-error --location --max-time 25 https://ai-divination-mcp-git-sync.vercel.app/health)"
          jq -e --arg source "$SOURCE" '.status=="ok" and .source_commit==$source' >/dev/null <<< "$live"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Stable tag already exists. Refuse overwrite."; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Stable release already exists. Refuse overwrite."; exit 1
          fi
          cat > "$RUNNER_TEMP/mcp-v142-notes.md" <<'NOTES'
          ## Git Sync MCP 1.4.2 — Stable

          **Scope:** AI Divination Private – Git Sync MCP only; independent of the whole ai-divination-playbook v0.x series.

          - Runtime version: `1.4.2-natural-language-timing` (verified).
          - Production deployment commit: `3675ff4804bf5edcfbd7e871c2700ef618aadbce` (generated-release PR #428).
          - Exact pinned canonical runtime/policy source: `fcefad4a591490351aef2d4d3edad297a0e9a5b0` (runtime-identity PR #427).
          - Production endpoint: https://ai-divination-mcp-git-sync.vercel.app
          - Interpretation policy: `canonical-owner-parity-v1`; routing: `auto-routing-v2`.
          - Fixes natural-language timing questions: open-ended dates request needed time windows rather than misrouting; ISO/slash/Chinese dates and discrete-window comparisons preserve Tarot/Meihua/Liuyao responsibility.
          - Nonrandom `plan_batch_chunks` acceptance in connected Production covered clarification, comparison, deadline, and process evolution without casting.
          - GitHub `validate` and `casting-runtime` checks succeeded on the deployment commit and its candidate PR.
          - Original raw casts, existing receipts, three-method allowlist and SHA-pinned policy provenance remain unchanged.

          **Boundaries:** No automatic recasting, no storage, no exactly-once semantics, no recovery of lost responses, no Astrology/Zi Wei/Palmistry method admission. No claim of deterministic prediction accuracy or model prose parity. Prior Git Sync MCP 1.4.1 Stable tag and whole-Playbook v0.x tags remain unchanged.
          NOTES
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases"             -f "tag_name=$TAG" -f "target_commitish=$TARGET"             -f 'name=Git Sync MCP 1.4.2 — Stable'             -f "body=$(cat "$RUNNER_TEMP/mcp-v142-notes.md")"             -F draft=false -F prerelease=false -f make_latest=false             > "$RUNNER_TEMP/mcp-v142-release.json"
          jq -e --arg tag "$TAG" --arg target "$TARGET"             '.tag_name==$tag and .target_commitish==$target and .draft==false and .prerelease==false'             >/dev/null < "$RUNNER_TEMP/mcp-v142-release.json"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$TARGET"
          echo "::notice::Published $TAG targeting $TARGET and verified the exact tag ref."
