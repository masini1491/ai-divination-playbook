name: Temp rebuild Astrology core bundle P1-140

on:
  push:
    branches:
      - feature/ast-p1-140-transit-house-context

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ast-p1-140-transit-house-context
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Astrology dependency
        run: python -m pip install astronomy-engine==2.1.19
      - name: Rebuild canonical Astrology core bundle
        run: |
          python tools/build_astrology_core_bundle.py
          python tools/build_astrology_core_bundle.py --check
      - name: Verify bounded mutation
        run: |
          git status --short
          changed="$(git status --short | awk '{print $2}')"
          test "$changed" = "runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json"
      - name: Commit regenerated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json
          git commit -m "Rebuild Astrology deterministic core bundle"
          git push origin HEAD:feature/ast-p1-140-transit-house-context
