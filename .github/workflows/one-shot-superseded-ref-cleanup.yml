name: One-shot superseded ref cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGETS: |
        research/ziwei-star-palace-v4-batch12-servant-reconcile 417bd45e877e465676391e41e2beb1a800fd2732
        research/ziwei-star-palace-v4-batch13-children e00abde1e43241f420aa48685f9a667d54d61c72
    steps:
      - name: Preflight and delete superseded refs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          count=0
          while read -r branch expected; do
            [ -n "$branch" ] || continue
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            actual="$(gh api "repos/$REPO/git/ref/heads/$encoded" --jq '.object.sha')"
            test "$actual" = "$expected"
            echo "PRECHECK_OK $branch $actual"
            count=$((count+1))
          done <<< "$TARGETS"
          test "$count" -eq 2
          while read -r branch expected; do
            [ -n "$branch" ] || continue
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded"
            ! gh api "repos/$REPO/git/ref/heads/$encoded" >/dev/null 2>&1
            echo "DELETED_BY_THIS_RUN $branch $expected"
          done <<< "$TARGETS"
          echo "DELETE_COUNT_OK 2"
      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          path=".github/workflows/one-shot-superseded-ref-cleanup.yml"
          sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/$REPO/contents/$path" -f message="Remove one-shot superseded ref cleanup" -f sha="$sha" -f branch="main"
          echo "WORKFLOW_REMOVED"
