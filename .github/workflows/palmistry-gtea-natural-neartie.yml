name: Palmistry GTEA Natural Near-tie (Ephemeral)

on:
  push:
    branches: [research/palmistry-gtea-natural-neartie]

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1'
      - name: Screen retained-two natural frames
        run: |
          python - <<'PY'
          import hashlib, io, json, math, os, re, sys, urllib.request, xml.etree.ElementTree as ET, zipfile
          from pathlib import Path, PurePosixPath
          import cv2, mediapipe as mp, numpy as np
          sys.path.insert(0, os.path.abspath('references/palmistry'))
          from association_ambiguity_probe import MODEL_URL, MODEL_SHA256, download, detect_full
          DATA_URL='https://www.dropbox.com/scl/fi/c3t6f2fl420157dnteatl/hand2K_dataset.zip?rlkey=zrxsntio1npottn21gtxcxack&dl=1'; ARCHIVE_SHA='a64c0fcff572414fa964c5b524e989ffe2e0a6023316bf4554a0f3e24d66fb8b'
          req=urllib.request.Request(DATA_URL,headers={'User-Agent':'ai-divination-playbook-palmistry-research/1.0'}); h=hashlib.sha256(); buf=io.BytesIO()
          with urllib.request.urlopen(req,timeout=180) as r:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  h.update(b); buf.write(b)
          if h.hexdigest()!=ARCHIVE_SHA: raise RuntimeError('archive sha mismatch')
          buf.seek(0); model=Path('hand_landmarker.task')
          if download(MODEL_URL,model)!=MODEL_SHA256: raise RuntimeError('model sha mismatch')
          def norm(s): return ' '.join((s or '').replace('_',' ').lower().split())
          def poly(o): return np.array([(float(p.findtext('x')),float(p.findtext('y'))) for p in o.findall('./polygon/pt')],np.float32)
          def centroid(p):
              m=cv2.moments(p)
              return np.array([m['m10']/m['m00'],m['m01']/m['m00']],float) if abs(m['m00'])>1e-9 else p.mean(axis=0).astype(float)
          def palm_center(c):
              a=c['all_landmarks']; return np.mean(np.array([a[0],a[5],a[17]],float),axis=0)
          def dist(a,b,d): return float(np.linalg.norm(a-b)/d)
          def inside(pt,p): return int(cv2.pointPolygonTest(p,(float(pt[0]),float(pt[1])),False)>=0)
          rows=[]
          with zipfile.ZipFile(buf) as z:
              names=set(z.namelist()); items=[]
              for xn in sorted(n for n in names if n.startswith('GTEA/') and n.endswith('.xml')):
                  root=ET.fromstring(z.read(xn)); objs=[o for o in root.findall('./object') if (o.findtext('deleted') or '0')!='1']; hands={norm(o.findtext('name')):o for o in objs if norm(o.findtext('name')) in ('left hand','right hand')}
                  if set(hands)!={'left hand','right hand'}: continue
                  stem=PurePosixPath(xn).stem; imn=f'GTEA/Images/{stem}.jpg'
                  if imn in names: items.append((stem,imn,poly(hands['left hand']),poly(hands['right hand'])))
              opts=mp.tasks.vision.HandLandmarkerOptions(base_options=mp.tasks.BaseOptions(model_asset_path=str(model)),running_mode=mp.tasks.vision.RunningMode.IMAGE,num_hands=4,min_hand_detection_confidence=.5,min_hand_presence_confidence=.5,min_tracking_confidence=.5)
              with mp.tasks.vision.HandLandmarker.create_from_options(opts) as lm:
                  for stem,imn,lp,rp in items:
                      im=cv2.imdecode(np.frombuffer(z.read(imn),np.uint8),cv2.IMREAD_COLOR); H,W=im.shape[:2]; diag=math.hypot(W,H); cs=detect_full(lm,im)
                      if len(cs)!=2: continue
                      pc=[palm_center(c) for c in cs]; lc,rc=centroid(lp),centroid(rp); A=dist(pc[0],lc,diag)+dist(pc[1],rc,diag); B=dist(pc[1],lc,diag)+dist(pc[0],rc,diag)
                      if A<=B: best='A'; bestc,second=A,B; pairs=[(0,lp),(1,rp)]
                      else: best='B'; bestc,second=B,A; pairs=[(1,lp),(0,rp)]
                      rows.append({'stem':stem,'best_assignment':best,'best_cost_diag':bestc,'second_cost_diag':second,'gap_diag':second-bestc,'gap_relative_to_best':None if bestc<=1e-12 else (second-bestc)/bestc,'best_centers_inside_xml_polygons':sum(inside(pc[i],p) for i,p in pairs),'candidate_handedness':[c.get('handedness') for c in cs]})
          rows.sort(key=lambda r:r['gap_diag']); n=len(rows); inside2=sum(r['best_centers_inside_xml_polygons']==2 for r in rows); inside1=sum(r['best_centers_inside_xml_polygons']==1 for r in rows); inside0=n-inside2-inside1
          def seq(stem): return re.sub(r'_[0-9]+$','',stem)
          chronological=sorted(rows,key=lambda r:(seq(r['stem']),int(re.search(r'_([0-9]+)$',r['stem']).group(1)))); flips=[]; prev={}
          for r in chronological:
              s=seq(r['stem'])
              if s in prev and prev[s]['best_assignment']!=r['best_assignment']: flips.append([prev[s]['stem'],r['stem'],prev[s]['best_assignment'],r['best_assignment']])
              prev[s]=r
          out={'status':'research-only','retained_exactly_two_frames':n,'best_assignment_inside2':inside2,'inside1':inside1,'inside0':inside0,'assignment_flips_adjacent_retained_samples':len(flips),'flip_examples':flips[:20],'smallest_gap_rows':rows[:30],'gap_summary':{'min':rows[0]['gap_diag'] if rows else None,'median':float(np.median([r['gap_diag'] for r in rows])) if rows else None,'p10':float(np.quantile([r['gap_diag'] for r in rows],.1)) if rows else None},'evidence_boundary':'XML polygons are source annotation; candidate palm centers and assignment costs are derived observations. Detector handedness is recorded but not used as anatomical truth. No numeric ambiguity cutoff is inferred.'}
          print('=== GTEA_NATURAL_NEARTIE_JSON ==='); print(json.dumps(out,indent=2))
          if n<100: raise RuntimeError(f'expected broad retained-two population, got {n}')
          PY
