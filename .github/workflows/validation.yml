name: Validate Playbook

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  temp-astrology-branch-cleanup:
    if: github.event_name == 'pull_request' && github.head_ref == 'maintenance/astrology-branch-cleanup-20260926'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete admitted Astrology branches with exact-SHA preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/targets <<'EOF'
          astrology/reconcile-e8-research-readiness|40dfc465986d64fe0beb1ece46690729937ff106
          astrology-derived-interpretation-admission|0d38d5b27200d1c415d42115452531a4f6e3e0f6
          astrology-e6-pattern-topology|d56d09620d6de0cf8537f9a160a512d0f7a5b4f9
          feature/admit-astrology-place-profile500-transport|5a556ca92c3da0fbc735065e50f7de90a2522a53
          feature/astrology-place-profile500-production|706c03fe56328f63c4bea0ad7ef90982898e1332
          fix/astrology-repo-local-production-authority|4bfbafa8dcdb33a9fcbd93adb69c96cd18b4e2d4
          research/astrology-exp1-sampled-results|b64f4f2aadf123bfd39b01b80c4e0b7a4398b50d
          research/astrology-exp2-mean-lilith-results|585b363f59fd4a578728028f65b9ebe945bc2995
          research/astrology-exp3-osculating-lilith-results|985a5c4bacfa45e324854440fa5332622a93e342
          research/astrology-exp4-special-points-results|7c6138c129439a8d50ae88d74fc1a6fbb8e082c9
          research/astrology-place-connect-evidence|5f12c6f21794f903dfe7e23dbae2d6b8a65713e7
          research/astrology-place-connect-evidence-close|ece539418bd5d54ff96f397b186ae216618c3f4a
          research/astrology-place-real-shard-evidence|d1cdaedb697020d24db342c8aafce0f77bd9da9a
          research/astrology-place-shard-contract|501d200ce55d8baf36c16e0ffa1ff1294af74544
          research/astrology-place-shard-poc|fbe33068c7f7f6bbdee9b10d37eb3f0549e59ca4
          research/astrology-place-shard-split-poc|8360a8c0c1dfffae114319b7a848b139a97583f7
          feature/ast-p1-100-derived-fact-semantics|f63ce005267d5d7ec9d57a4cb6c4b41f5f4f2e34
          feature/ast-p1-110-extended-aspect-policies|ed43312c57c0e605d2ea3fb79e341dddd7001976
          feature/ast-p1-120-special-pattern-policies|d6aa5797b33b89cef0916df9f5a92a64b9017d6e
          feature/ast-p1-130-transit-house-search|3a997781f9be0842a3f85d601bb52c1e215ceffd
          feature/ast-p1-140-transit-house-context|0e3b9d1e0bcb46c1dd9af65cdb445964ed3df004
          astrology-e2-live-oracle-probe|48ac20db592dabe0f7106c0775e0c28714e3cc98
          research/astrology-exp1-sampled-probe|1e4c8e64d7eec1ec86b0af8e9db4d3d0ba3698eb
          research/astrology-exp2-mean-lilith-probe|52fb14b65ce5adfe9a3c0b119e1426f58819c1ee
          research/astrology-exp3-osculating-lilith-probe|2a3abfe70788a85db5cb5beb0dfc91ea6050d594
          research/astrology-exp4-special-points-probe|13691feef30bb076068961c1f45b29e66f6b4ac5
          research/astrology-place-connect-proof|d06a041e83322ccfbff936272a98c90a546dbb32
          research/astrology-place-one-shot-publisher|b533672086266842fa325fe3ceec11d47d695c2e
          research/astrology-place-real-connect-probe|28594152cc8b5ae1f35a2959770ac68e5f5d2a44
          research/astrology-place-real-shard-probe|8c378bd6cce0f06c2b0f558296ef80f179df7052
          research/astrology-place-shard-transport-probe|fdf5fa8f3236984c05257d648b0907330a6ce7ae
          research/astrology-repo-local-authority-divination|3e36987127e52886239ea17d664b234c4e4b557b
          research/ast-p1-130-core-bundle-bridge|dfdb2db029cc576ff31345240717a763309a7726
          feature/ast-p1-130-transit-house-context|f0d613a3f2a3c51d35eab20f6035f220ffe5a6e8
          EOF
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" 2>/dev/null || true)"
            if [ -z "$ref_json" ]; then
              echo "SKIP_MISSING|$branch"
              continue
            fi
            actual="$(printf '%s' "$ref_json" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
            if [ "$actual" != "$expected" ]; then
              echo "DRIFT|$branch|expected=$expected|actual=$actual"
              exit 42
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
            echo "DELETED|$branch|$actual"
          done < /tmp/targets
      - name: Delete cleanup branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/maintenance/astrology-branch-cleanup-20260926"

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Astrology provider dependency
        run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt

      - name: Install Zi Wei calendar dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt

      - name: Verify ChatGPT load pack
        run: python tools/build_chatgpt_load_pack.py --check

      - name: Verify ChatGPT load budget
        run: python tools/chatgpt_load_benchmark.py --check

      - name: Verify bounded loader ranges
        run: python tools/validate_loader_ranges.py

      - name: Verify loader behavioral regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class loader-optimization

      - name: Verify Astrology rule-layering regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class astrology-rule-layering

      - name: Verify Astrology deterministic core tool bundle
        run: python tools/build_astrology_core_bundle.py --check

      - name: Verify Astrology deterministic materialization regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class astrology-deterministic-materialization

      - name: Verify output-core regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class output-core-refactor

      - name: Verify shared development baseline regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class shared-development-baseline

      - name: Verify private-context inference-egress regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class privacy-inference-egress

      - name: Run loader deterministic contract regression
        run: python tools/loader_contract_regression.py

      - name: Verify Liuyao deterministic tool bundle
        run: python tools/build_liuyao_tool_bundle.py --check

      - name: Verify Meihua deterministic tool bundle
        run: python tools/build_meihua_tool_bundle.py --check

      - name: Verify Zi Wei deterministic tool bundle
        run: python tools/build_ziwei_tool_bundle.py --check

      - name: Verify Zi Wei deterministic regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class ziwei-deterministic-materialization

      - name: Verify Meihua deterministic regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class meihua-deterministic-materialization

      - name: Validate Agent Skills gateway
        run: python tools/validate_agent_skills.py

      - name: Verify Agent Skills behavioral regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class agent-skills-adapter

      - name: Validate cross-agent bootstrap adapters
        run: python tools/validate_cross_agent_adapters.py

      - name: Verify cross-agent behavioral regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class cross-agent-bootstrap-adapters

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run structural checker
        run: python tools/playbook_check.py .

  casting-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate migration source manifest
        run: python -m json.tool runtime/casting/MIGRATION_SOURCE.json > /dev/null

      - name: Validate OpenAPI JSON
        run: python -m json.tool runtime/casting/openapi.json > /dev/null

      - name: Run Randomizer runtime unit and contract tests
        run: python -m unittest discover -s tests/casting -v

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, casting-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Wait for matching Vercel production deployment and smoke-test all methods
        env:
          CURRENT_SHA: ${{ github.sha }}
          CAST_URL: https://ai-divination-playbook-casting-masini1491-9205.vercel.app/api/cast
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request

          url = os.environ["CAST_URL"]
          current = os.environ["CURRENT_SHA"]

          def git(*args):
              return subprocess.run(
                  ["git", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()

          current_runtime_tree = git("rev-parse", f"{current}:runtime/casting")

          def deployment_provenance_ok(deployed):
              if not isinstance(deployed, str) or re.fullmatch(r"[0-9a-f]{40}", deployed) is None:
                  return False, f"invalid runtime_source_commit={deployed!r}"
              try:
                  git("cat-file", "-e", f"{deployed}^{{commit}}")
                  ancestor = subprocess.run(
                      ["git", "merge-base", "--is-ancestor", deployed, current],
                      check=False,
                  ).returncode == 0
                  if not ancestor:
                      return False, f"deployment commit {deployed} is not an ancestor of current main {current}"
                  deployed_runtime_tree = git("rev-parse", f"{deployed}:runtime/casting")
              except subprocess.CalledProcessError as exc:
                  return False, f"cannot verify deployment commit {deployed}: {exc}"
              if deployed_runtime_tree != current_runtime_tree:
                  return False, (
                      f"runtime/casting tree mismatch: deployed={deployed_runtime_tree} "
                      f"current={current_runtime_tree} commit={deployed}"
                  )
              return True, deployed

          def post(body):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  method="POST",
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      raw = response.read()
                      return response.status, response.headers, json.loads(raw)
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  payload = json.loads(raw) if raw else {}
                  return exc.code, exc.headers, payload

          def valid_contract(body, method, check):
              status, headers, payload = post(body)
              cache_control = headers.get("Cache-Control", "")
              if status != 200:
                  return False, f"{method}: status={status}"
              if "no-store" not in cache_control:
                  return False, f"{method}: cache={cache_control!r}"
              expected_identity = {
                  "source": "divination-casting-randomizer-python",
                  "algorithm_version": "2",
                  "schema_version": "4",
                  "ai_schema_version": "1",
                  "timezone": "Asia/Taipei",
              }
              for key, value in expected_identity.items():
                  if payload.get(key) != value:
                      return False, f"{method}: {key}={payload.get(key)!r}"
              provenance_ok, provenance_detail = deployment_provenance_ok(
                  payload.get("runtime_source_commit")
              )
              if not provenance_ok:
                  return False, f"{method}: {provenance_detail}"
              results = payload.get("results")
              if not isinstance(results, list) or len(results) != 1:
                  return False, f"{method}: result_count={len(results) if isinstance(results, list) else 'invalid'}"
              result = results[0]
              if result.get("method") != method:
                  return False, f"{method}: response_method={result.get('method')!r}"
              if not check(result):
                  return False, f"{method}: stochastic fact shape mismatch"
              return True, f"{method}: ok"

          checks = [
              (
                  {"method": "tarot", "count": 3, "repeat": 1},
                  "tarot",
                  lambda result: len(result.get("tarot", {}).get("cards", [])) == 3,
              ),
              (
                  {"method": "plum", "repeat": 1},
                  "plum",
                  lambda result: (
                      isinstance(result.get("plum", {}).get("a"), str)
                      and isinstance(result.get("plum", {}).get("b"), str)
                      and isinstance(result.get("plum", {}).get("moving_line"), int)
                  ),
              ),
              (
                  {"method": "liuyao", "repeat": 1},
                  "liuyao",
                  lambda result: (
                      result.get("liuyao", {}).get("line_order") == "bottom-to-top"
                      and len(result.get("liuyao", {}).get("values", [])) == 6
                      and len(result.get("liuyao", {}).get("coin_values", [])) == 6
                  ),
              ),
          ]

          last = "no response"
          for attempt in range(30):
              failures = []
              for body, method, check in checks:
                  try:
                      ok, detail = valid_contract(body, method, check)
                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                      ok, detail = False, f"{method}: {exc!r}"
                  if not ok:
                      failures.append(detail)

              try:
                  status, headers, payload = post({"method": "unknown"})
                  invalid_ok = (
                      status == 400
                      and "no-store" in headers.get("Cache-Control", "")
                      and payload.get("error", {}).get("code") == "invalid_request"
                  )
                  if not invalid_ok:
                      failures.append(
                          f"invalid: status={status} cache={headers.get('Cache-Control', '')!r} "
                          f"code={payload.get('error', {}).get('code')!r}"
                      )
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                  failures.append(f"invalid: {exc!r}")

              if not failures:
                  status, _, payload = post({"method": "tarot", "count": 1, "repeat": 1})
                  deployed = payload.get("runtime_source_commit") if status == 200 else None
                  print(
                      "production smoke passed: "
                      f"current_main={current} deployed_commit={deployed} "
                      f"runtime_tree={current_runtime_tree}"
                  )
                  raise SystemExit(0)

              last = "; ".join(failures)
              print(f"attempt {attempt + 1}/30 not ready: {last}")
              time.sleep(5)

          raise SystemExit(f"production smoke failed after retries: {last}")
          PY
