name: Validate Playbook

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Astrology provider dependency
        run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt

      - name: Install Zi Wei calendar dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt

      - name: Verify ChatGPT load pack
        run: python tools/build_chatgpt_load_pack.py --check

      - name: Verify ChatGPT load budget
        run: python tools/chatgpt_load_benchmark.py --check

      - name: Verify bounded loader ranges
        run: python tools/validate_loader_ranges.py

      - name: Verify loader behavioral regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class loader-optimization

      - name: Verify Astrology rule-layering regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class astrology-rule-layering

      - name: Verify Astrology deterministic core tool bundle
        run: python tools/build_astrology_core_bundle.py --check

      - name: Verify Astrology deterministic materialization regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class astrology-deterministic-materialization

      - name: Verify output-core regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class output-core-refactor

      - name: Verify shared development baseline regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class shared-development-baseline

      - name: Verify private-context inference-egress regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class privacy-inference-egress

      - name: Run loader deterministic contract regression
        run: python tools/loader_contract_regression.py

      - name: Verify Liuyao deterministic tool bundle
        run: python tools/build_liuyao_tool_bundle.py --check

      - name: Verify Meihua deterministic tool bundle
        run: python tools/build_meihua_tool_bundle.py --check

      - name: Verify Zi Wei deterministic tool bundle
        run: python tools/build_ziwei_tool_bundle.py --check

      - name: Verify Zi Wei deterministic regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class ziwei-deterministic-materialization

      - name: Verify Meihua deterministic regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class meihua-deterministic-materialization

      - name: Validate Agent Skills gateway
        run: python tools/validate_agent_skills.py

      - name: Verify Agent Skills behavioral regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class agent-skills-adapter

      - name: Validate cross-agent bootstrap adapters
        run: python tools/validate_cross_agent_adapters.py

      - name: Verify cross-agent behavioral regression selection
        run: python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class cross-agent-bootstrap-adapters

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run structural checker
        run: python tools/playbook_check.py .

  casting-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate migration source manifest
        run: python -m json.tool runtime/casting/MIGRATION_SOURCE.json > /dev/null

      - name: Validate OpenAPI JSON
        run: python -m json.tool runtime/casting/openapi.json > /dev/null

      - name: Run Randomizer runtime unit and contract tests
        run: python -m unittest discover -s tests/casting -v
