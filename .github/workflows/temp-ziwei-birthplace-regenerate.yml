name: Temporary Zi Wei birthplace regeneration

on:
  push:
    branches:
      - feature/ziwei-birthplace-timezone

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ziwei-birthplace-timezone
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt
      - name: Focused Zi Wei input regressions
        run: |
          python -m unittest tests.test_ziwei_birthplace_timezone -v
          python -m unittest tests.test_ziwei_year_notation -v
          python -m unittest tests.test_ziwei_production_contract_v1 -v
      - name: Regenerate deterministic caches
        run: |
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
          python tools/build_chatgpt_load_pack.py
          python tools/build_chatgpt_load_pack.py --check
          python tools/chatgpt_load_benchmark.py --check
          python -m unittest tests.test_ziwei_tool_bundle -v
      - name: Commit generated caches and remove bridge
        run: |
          rm .github/workflows/temp-ziwei-birthplace-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json CHATGPT_LOAD_PACK.json .github/workflows/temp-ziwei-birthplace-regenerate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Zi Wei input adapter caches"
          git push origin HEAD:feature/ziwei-birthplace-timezone
