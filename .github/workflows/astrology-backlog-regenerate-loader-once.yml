name: Regenerate Astrology backlog loader ranges
on:
  push:
    branches: [add-astrology-coordination-backlog]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_loader_ranges.py
      - run: python tools/validate_loader_ranges.py
      - shell: bash
        run: |
          rm .github/workflows/astrology-backlog-regenerate-loader-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAYBOOK_INDEX.json .github/workflows/astrology-backlog-regenerate-loader-once.yml
          git commit -m "Regenerate loader ranges for Astrology backlog index"
          git push origin "HEAD:${{ github.ref_name }}"
