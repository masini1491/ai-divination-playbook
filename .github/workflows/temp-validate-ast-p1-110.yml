name: Temporary validate AST-P1-110

on:
  push:
    branches:
      - feature/ast-p1-110-extended-aspect-policies
    paths:
      - .github/workflows/temp-validate-ast-p1-110.yml

permissions:
  contents: write

concurrency:
  group: temp-validate-ast-p1-110
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert exact pre-validation parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cc40ba087db13198ab8c78dd42e8782349a36e16"
          test "$(git status --short)" = ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned deterministic dependencies
        run: python -m pip install "astronomy-engine==2.1.19" "lunar-python==1.4.8"

      - name: Verify Astrology deterministic core bundle
        run: python tools/build_astrology_core_bundle.py --check

      - name: Run full unit tests
        run: python -m unittest discover -s tests -v

      - name: Run structural checker
        run: python tools/playbook_check.py .

      - name: Record successful validation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short)" = ""
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "CI PASS AST-P1-110 full unit and structural validation"
          git push origin HEAD:feature/ast-p1-110-extended-aspect-policies
