name: Temporary diagnose AST-P1-110 validation

on:
  push:
    branches:
      - feature/ast-p1-110-extended-aspect-policies
    paths:
      - .github/workflows/temp-validate-ast-p1-110.yml

permissions:
  contents: write

concurrency:
  group: temp-validate-ast-p1-110
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned deterministic dependencies
        run: python -m pip install "astronomy-engine==2.1.19" "lunar-python==1.4.8"

      - name: Run validation and capture status
        shell: bash
        run: |
          set +e
          python tools/build_astrology_core_bundle.py --check > /tmp/bundle.log 2>&1
          bundle_rc=$?
          python -m unittest discover -s tests -v > /tmp/tests.log 2>&1
          tests_rc=$?
          python tools/playbook_check.py . > /tmp/struct.log 2>&1
          struct_rc=$?
          tail -n 80 /tmp/tests.log > /tmp/tests-tail.log
          export BUNDLE_RC="$bundle_rc" TESTS_RC="$tests_rc" STRUCT_RC="$struct_rc"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              "schema": "temporary-ast-p1-110-validation-status-v1",
              "tested_commit": os.environ["GITHUB_SHA"],
              "bundle_check_exit_code": int(os.environ["BUNDLE_RC"]),
              "unit_tests_exit_code": int(os.environ["TESTS_RC"]),
              "structural_check_exit_code": int(os.environ["STRUCT_RC"]),
              "unit_test_tail": Path("/tmp/tests-tail.log").read_text(encoding="utf-8", errors="replace"),
              "bundle_tail": "\n".join(Path("/tmp/bundle.log").read_text(encoding="utf-8", errors="replace").splitlines()[-20:]),
              "structural_tail": "\n".join(Path("/tmp/struct.log").read_text(encoding="utf-8", errors="replace").splitlines()[-20:]),
          }
          Path(".github/temp-ast-p1-110-validation-status.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
        continue-on-error: true

      - name: Persist diagnostic status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/temp-ast-p1-110-validation-status.json"
          git commit -m "Record temporary AST-P1-110 validation status"
          git push origin HEAD:feature/ast-p1-110-extended-aspect-policies
