name: Zi Wei Calendar Full Parity Research

on:
  pull_request:
    paths:
      - "tools/ziwei_calendar_full_parity.py"
      - "tools/ziwei_calendar_data_poc.py"
      - "tools/ziwei_calendar_provider.py"
      - "requirements-ziwei-calendar.txt"
      - ".github/workflows/ziwei-calendar-parity.yml"

permissions:
  contents: read

jobs:
  full-parity-1900-2100:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Zi Wei calendar dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt
      - name: Verify full-day candidate window parity
        run: python tools/ziwei_calendar_full_parity.py --start 1900-01-01 --end 2100-12-31
