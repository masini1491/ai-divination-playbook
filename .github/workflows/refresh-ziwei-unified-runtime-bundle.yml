name: Refresh Zi Wei bundle

on:
  push:
    branches:
      - feat/ziwei-unified-runtime-v1

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lunar-python==1.4.8
      - run: python tools/build_ziwei_tool_bundle.py
      - run: python tools/build_ziwei_tool_bundle.py --check
      - name: Commit regenerated bundle and remove bridge
        shell: bash
        run: |
          rm .github/workflows/refresh-ziwei-unified-runtime-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json .github/workflows/refresh-ziwei-unified-runtime-bundle.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Zi Wei deterministic bundle"
          git push origin HEAD:${GITHUB_REF_NAME}
