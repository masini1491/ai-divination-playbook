name: Palmistry Retained Two-candidate Near-tie (Ephemeral)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  near_tie:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MediaPipe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1'
      - name: Run retained two-candidate near-tie stress
        run: |
          python references/palmistry/association_near_tie_probe.py --output-dir near-tie-output
