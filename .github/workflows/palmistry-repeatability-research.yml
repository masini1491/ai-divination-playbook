name: Palmistry Repeatability Research (Ephemeral)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/palmistry-repeatability-research.yml"
      - "references/palmistry/mediapipe_repeatability_runner.py"

permissions:
  contents: read

jobs:
  case-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned detector runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mediapipe==1.0.1"

      - name: Verify detector-agnostic harness
        run: python references/palmistry/real_image_repeatability_probe.py --self-test

      - name: Run MediaPipe Case A transform study
        run: |
          python references/palmistry/mediapipe_repeatability_runner.py \
            --output-dir palmistry-repeatability-output

      - name: Upload research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palmistry-repeatability-case-a
          path: palmistry-repeatability-output/
          if-no-files-found: warn
