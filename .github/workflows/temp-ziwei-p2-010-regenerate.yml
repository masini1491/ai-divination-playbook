name: Temporary Zi Wei P2-010 regeneration

on:
  push:
    branches:
      - feature/ziwei-p2-010-m1-auxiliary

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ziwei-p2-010-m1-auxiliary

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Zi Wei calendar dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt

      - name: Validate M1 claim registry
        run: python references/ziwei/validate_interpretation_claim_registry.py references/ziwei/ziwei_interpretation_claim_registry_m1_auxiliary_v1.json

      - name: Run focused P2-010 regressions
        run: |
          python -m unittest tests.test_ziwei_m1_auxiliary_v1 -v
          python -m unittest tests.test_ziwei_m0_auxiliary_v1 -v
          python -m unittest tests.test_ziwei_production_contract_v1 -v
          python -m unittest tests.test_ziwei_sihua_admission -v
          python -m unittest tests.test_ziwei_unified_runtime_v1 -v
          python -m unittest tests.test_ziwei_materialization_discoverability -v

      - name: Regenerate canonical derived caches
        run: |
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
          python tools/build_chatgpt_load_pack.py
          python tools/build_chatgpt_load_pack.py --check
          python tools/chatgpt_load_benchmark.py --check

      - name: Run bundle regression
        run: python -m unittest tests.test_ziwei_tool_bundle -v

      - name: Commit generated outputs and remove temporary bridge
        run: |
          rm .github/workflows/temp-ziwei-p2-010-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json CHATGPT_LOAD_PACK.json .github/workflows/temp-ziwei-p2-010-regenerate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Zi Wei P2-010 derived caches"
          git push origin HEAD:feature/ziwei-p2-010-m1-auxiliary
