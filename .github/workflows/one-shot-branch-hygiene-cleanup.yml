name: One-shot branch hygiene cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Guarded delete exact admitted refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "maintenance/branch-hygiene-cleanup-20260928" ]; then
            echo "Unexpected workflow ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          cat > /tmp/targets.tsv <<'EOF'
admit/ziwei-lianzhen-wealth-context b4fcbaf5c9270438fe5a6984603adb3b9768648f
admit/ziwei-wuqu-ming-context 9d1e021ff5cbd976bd55e822a8af5ef2cbab82d5
research/ziwei-star-palace-v4-batch1 eb9c924027346818f27761491730ec1911989647
research/ziwei-star-palace-v4-batch2-fortune 2d19b0ef9bb37338f8dbf4f49c26854df0c7ff87
research/ziwei-star-palace-v4-batch3-career be6adde37237346a138b0badf2c2b7a2e142b4ea
research/ziwei-star-palace-v4-batch4-natal-priority 75634450d3a300bcb35d21754f8cd4d7439a8352
research/ziwei-star-palace-v4-batch5-wealth c41154dc039121963b614d98b60f6579eee1d030
research/ziwei-star-palace-v4-batch6-parents 0ef329e57676041e52b4fa928a4146b320e1fc02
research/ziwei-star-palace-v4-batch7-spouse ad877486c07c28d4ca9c37e34c4dfa6977b86971
research/ziwei-star-palace-v4-batch8-travel e66a76088d0cb26d1a9af03bc17602a5b361b9ca
research/ziwei-star-palace-v4-batch9-property 189271a9ecf93ba3e57048debd9d0ed78da26b80
research/ziwei-star-palace-v4-batch10-ming dcea71f57a818faf8605533d1c3acec67b91e318
research/ziwei-star-palace-v4-batch11-siblings 1a90b2d9987f52e9a056e2583a799a48d15eac7f
research/ziwei-star-palace-v4-batch12-servant 80fb29d14b433d564db3d642d95de27e26e8867f
research/ziwei-star-palace-v4-batch12-servant-reconcile-v2 88dfb4e428c3016a772fcc3090ce90a04a68bf5d
research/ziwei-star-palace-v4-batch13-children-reconcile 70af43c9d4c049b254bb58dd8f69f2d703638478
temp/add-p1-030-daily-bridge cc21858f5832caee360a92a2d23510b93105014d
temp/add-p1-030-hourly-bridge 79ca77a6d52ef6223d3ddd11858ad358596b8d35
temp/add-p1-030-monthly-bridge 98fcc787221967949de6c8f7632b8ce9589aa073
temp/add-p1-040-daily-bridge 6ad2bbe8ff6c02d874823fc3ee2a69840ed3b414
temp/add-p1-040-decadal-bridge 32915e27566dbd74538317db315dffb611537b9c
temp/add-p1-040-hourly-bridge 1fa10211f5aed6f90c560b496477c07811cb3396
temp/add-p1-040-monthly-bridge d143fcfaa3c63ade7af1caaa4ad0672df6146c37
temp/add-p1-040-yearly-bridge ebd9ee5fdda809ab324e2c15e7bc5bdd9ec4f70a
temp/add-p2-030-civil-time-bridge abc46b03123afa9746aeb10e3111a508fd8d8b99
temp/fix-yearly-bridge-yaml 1c5e81dda561fdd650bea6e0a06755b5bd0d6934
temp/relax-yearly-bridge-load-pack-diff e739432ca0d02e8feffa9d6301086c266ee9220c
temp/remove-yearly-bridge d17f6c1b9c7e44703a39566da740f776f6c5550b
EOF

          # Fresh all-or-nothing identity preflight.
          while read -r branch expected; do
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            actual="$(gh api "repos/$REPO/git/ref/heads/$encoded" --jq '.object.sha')"
            test "$actual" = "$expected" || {
              echo "PRECHECK_MISMATCH $branch expected=$expected actual=$actual" >&2
              exit 1
            }
            echo "PRECHECK_OK $branch $actual"
          done < /tmp/targets.tsv

          # Delete only after every target passed the fresh preflight.
          while read -r branch expected; do
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded"
            if gh api "repos/$REPO/git/ref/heads/$encoded" >/dev/null 2>&1; then
              echo "DELETE_READBACK_FAILED $branch" >&2
              exit 1
            fi
            echo "DELETED_BY_THIS_RUN $branch $expected"
          done < /tmp/targets.tsv

      - name: Delete one-shot bridge ref
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$REPO/git/refs/heads/maintenance%2Fbranch-hygiene-cleanup-20260928"
          echo "BRIDGE_REF_DELETED"
