name: TEMP2 AST-P2-040 Rebuild Core Bundle

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp2-ast-p2-040-rebuild-core-bundle.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ast-p2-040-production-admission
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt
      - run: |
          python tools/build_astrology_core_bundle.py
          python tools/build_astrology_core_bundle.py --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild Astrology deterministic core bundle"
          git push origin HEAD:feature/ast-p2-040-production-admission
