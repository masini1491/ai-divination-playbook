name: TEMP Zi Wei bundle regeneration bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'admit/ziwei-wuqu-ming-context'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Zi Wei build dependency
        run: python -m pip install lunar-python==1.4.8
      - name: Regenerate canonical Zi Wei deterministic bundle
        run: |
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
      - name: Commit generated cache and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json
          if git diff --cached --quiet; then
            echo "Expected Zi Wei deterministic bundle to change" >&2
            exit 1
          fi
          git commit -m "Regenerate Zi Wei deterministic bundle"
          git rm .github/workflows/temp-ziwei-bundle-bridge.yml
          git commit -m "Remove temporary Zi Wei bundle bridge"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
