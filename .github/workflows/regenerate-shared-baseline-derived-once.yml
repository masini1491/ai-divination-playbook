name: One-time regenerate shared-baseline derived metadata

on:
  push:
    branches:
      - refactor/shared-development-baseline
    paths:
      - .github/workflows/regenerate-shared-baseline-derived-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-development-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate load pack and loader ranges
        run: |
          python tools/build_chatgpt_load_pack.py
          python tools/build_loader_ranges.py
      - name: Commit derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHATGPT_LOAD_PACK.json PLAYBOOK_INDEX.json
          if git diff --cached --quiet; then
            echo "No derived changes"
            exit 0
          fi
          git commit -m "Regenerate shared-baseline loader metadata"
          git push origin HEAD:refactor/shared-development-baseline
