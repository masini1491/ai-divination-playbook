name: Palmistry GTEA Sequence Held-out (Ephemeral)

on:
  push:
    branches:
      - research/palmistry-gtea-heldout

permissions:
  contents: read

jobs:
  heldout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1' 'scipy>=1.15,<2'
      - name: Execute frozen sequence-held-out study
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, math, os, re, sys, urllib.request, xml.etree.ElementTree as ET, zipfile
          from collections import defaultdict, Counter
          from pathlib import Path, PurePosixPath
          import cv2
          import mediapipe as mp
          import numpy as np
          from scipy.stats import mannwhitneyu

          sys.path.insert(0, os.path.abspath('references/palmistry'))
          from association_ambiguity_probe import MODEL_URL, MODEL_SHA256, download, detect_full

          DATA_URL='https://www.dropbox.com/scl/fi/c3t6f2fl420157dnteatl/hand2K_dataset.zip?rlkey=zrxsntio1npottn21gtxcxack&dl=1'
          ARCHIVE_SHA='a64c0fcff572414fa964c5b524e989ffe2e0a6023316bf4554a0f3e24d66fb8b'

          req=urllib.request.Request(DATA_URL,headers={'User-Agent':'ai-divination-playbook-palmistry-research/1.0'})
          h=hashlib.sha256(); buf=io.BytesIO()
          with urllib.request.urlopen(req,timeout=180) as r:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  h.update(b); buf.write(b)
          archive_sha=h.hexdigest()
          if archive_sha!=ARCHIVE_SHA: raise RuntimeError(f'archive sha mismatch: {archive_sha}')
          buf.seek(0)

          model=Path('hand_landmarker.task')
          if download(MODEL_URL,model)!=MODEL_SHA256: raise RuntimeError('model sha mismatch')

          def norm_label(s): return ' '.join((s or '').replace('_',' ').lower().split())
          def poly(obj):
              return np.array([(float(p.findtext('x')),float(p.findtext('y'))) for p in obj.findall('./polygon/pt')],np.float32)
          def area(p): return float(abs(cv2.contourArea(p)))
          def decode(z,name):
              im=cv2.imdecode(np.frombuffer(z.read(name),np.uint8),cv2.IMREAD_COLOR)
              if im is None: raise RuntimeError('decode failed '+name)
              return im
          def seq_from_stem(stem):
              return re.sub(r'_[0-9]+$','',stem)
          def touch_descriptor(p,W,H):
              eps=1.0
              sides=int(p[:,0].min()<=eps)+int(p[:,1].min()<=eps)+int(p[:,0].max()>=W-1-eps)+int(p[:,1].max()>=H-1-eps)
              return {'touch': int(sides>0), 'sides': int(sides)}

          with zipfile.ZipFile(buf) as z:
              names=set(z.namelist()); items=[]
              for xn in sorted(n for n in names if n.startswith('GTEA/') and n.endswith('.xml')):
                  root=ET.fromstring(z.read(xn))
                  objs=[o for o in root.findall('./object') if (o.findtext('deleted') or '0')!='1']
                  hands={norm_label(o.findtext('name')):o for o in objs if norm_label(o.findtext('name')) in ('left hand','right hand')}
                  if set(hands)!={'left hand','right hand'}: continue
                  stem=PurePosixPath(xn).stem; imn=f'GTEA/Images/{stem}.jpg'
                  if imn not in names: continue
                  items.append((seq_from_stem(stem),stem,imn,hands['left hand'],hands['right hand']))

              opts=mp.tasks.vision.HandLandmarkerOptions(
                  base_options=mp.tasks.BaseOptions(model_asset_path=str(model)),
                  running_mode=mp.tasks.vision.RunningMode.IMAGE,
                  num_hands=4,
                  min_hand_detection_confidence=0.5,
                  min_hand_presence_confidence=0.5,
                  min_tracking_confidence=0.5)
              rows=[]
              with mp.tasks.vision.HandLandmarker.create_from_options(opts) as lm:
                  for seq,stem,imn,lo,ro in items:
                      im=decode(z,imn); H,W=im.shape[:2]
                      lp,rp=poly(lo),poly(ro); la,ra=area(lp),area(rp)
                      ar=float(min(la,ra)/max(la,ra)) if max(la,ra)>0 else 0.0
                      min_area=float(min(la,ra)/(W*H))
                      ltd,rtd=touch_descriptor(lp,W,H),touch_descriptor(rp,W,H)
                      trunc_hands=int(ltd['touch']+rtd['touch'])
                      trunc_sides=int(ltd['sides']+rtd['sides'])
                      count=int(len(detect_full(lm,im)))
                      rows.append({'sequence':seq,'stem':stem,'count':count,'retained':int(count>=2),'area_ratio':ar,'min_area_frac':min_area,'truncated_hands':trunc_hands,'truncated_sides':trunc_sides})

          by=defaultdict(list)
          for r in rows: by[r['sequence']].append(r)
          seq_results=[]
          informative=0; area_agree=0; min_agree=0
          for seq in sorted(by):
              rr=by[seq]; ret=[x for x in rr if x['retained']]; lost=[x for x in rr if not x['retained']]
              out={'sequence':seq,'n':len(rr),'retained_n':len(ret),'lost_n':len(lost),'outcome_homogeneous':int(not ret or not lost)}
              for f in ('area_ratio','min_area_frac'):
                  out[f+'_median_retained']=float(np.median([x[f] for x in ret])) if ret else None
                  out[f+'_median_lost']=float(np.median([x[f] for x in lost])) if lost else None
                  if ret and lost:
                      u,p=mannwhitneyu([x[f] for x in ret],[x[f] for x in lost],alternative='two-sided')
                      auc=float(u/(len(ret)*len(lost)))
                      out[f+'_auc']=auc
                      out[f+'_direction_retained_gt_lost']=int(auc>0.5)
                  else:
                      out[f+'_auc']=None; out[f+'_direction_retained_gt_lost']=None
              out['truncated_hands_mean_retained']=float(np.mean([x['truncated_hands'] for x in ret])) if ret else None
              out['truncated_hands_mean_lost']=float(np.mean([x['truncated_hands'] for x in lost])) if lost else None
              out['truncated_sides_mean_retained']=float(np.mean([x['truncated_sides'] for x in ret])) if ret else None
              out['truncated_sides_mean_lost']=float(np.mean([x['truncated_sides'] for x in lost])) if lost else None
              if ret and lost:
                  informative+=1
                  area_agree+=int(out['area_ratio_auc']>0.5)
                  min_agree+=int(out['min_area_frac_auc']>0.5)
              seq_results.append(out)

          dist=Counter(r['count'] for r in rows)
          result={
              'status':'research-only',
              'archive_sha256':archive_sha,
              'model_sha256':MODEL_SHA256,
              'eligible_frames':len(rows),
              'sequence_count':len(by),
              'final_candidate_distribution':{str(k):int(v) for k,v in sorted(dist.items())},
              'informative_sequences':informative,
              'area_ratio_direction_agree_n':area_agree,
              'area_ratio_direction_agree_fraction':float(area_agree/informative) if informative else None,
              'min_area_frac_direction_agree_n':min_agree,
              'min_area_frac_direction_agree_fraction':float(min_agree/informative) if informative else None,
              'sequence_results':seq_results,
              'evidence_boundary':'whole sequences are evaluation strata; no numeric cutoff was tuned; homogeneous sequences are excluded from within-sequence AUC direction claims; results remain reference-only.'
          }
          print('=== GTEA_SEQUENCE_HELDOUT_JSON ===')
          print(json.dumps(result,indent=2))
          if informative < 3: raise RuntimeError('too few informative sequences')
          PY
