name: Astrology E7 one-time materialization
on:
  push:
    branches: [astrology-e7-rulership-admission]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install provider dependency
        run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt
      - name: Rebuild core bundle
        run: python tools/build_astrology_core_bundle.py
      - name: Run E7 targeted regression
        run: >-
          python -m unittest
          tests.test_astrology_rulership_projection
          tests.test_astrology_production_contract
          tests.test_astrology_core_tool_bundle
      - name: Remove bridge and verify bundle
        shell: bash
        run: |
          rm .github/workflows/astrology-e7-materialize-once.yml
          python tools/build_astrology_core_bundle.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json .github/workflows/astrology-e7-materialize-once.yml
          git commit -m "Regenerate Astrology core bundle for E7"
          git push origin "HEAD:${{ github.ref_name }}"
