name: Astrology derived fact guard targeted regression

on:
  push:
    branches: [astrology-derived-fact-guard-fix]

permissions:
  contents: write

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Astrology provider dependency
        run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt

      - name: Run targeted regression
        run: >-
          python -m unittest
          tests.test_astrology_interpretation_handoff
          tests.test_astrology_output_guard
          tests.test_astrology_reading_pipeline
          tests.test_astrology_evidence_selector
          tests.test_astrology_typed_reading_pipeline

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/astrology-derived-guard-test-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/astrology-derived-guard-test-once.yml
          git commit -m "Retire derived fact guard test bridge"
          git push origin "HEAD:${{ github.ref_name }}"
