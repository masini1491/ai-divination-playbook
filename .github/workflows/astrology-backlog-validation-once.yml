name: Astrology backlog validation
on:
  push:
    branches: [add-astrology-coordination-backlog]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_chatgpt_load_pack.py --check
      - run: python tools/check_playbook.py
      - shell: bash
        run: |
          rm .github/workflows/astrology-backlog-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/astrology-backlog-validation-once.yml
          git commit -m "Retire Astrology backlog validation bridge"
          git push origin "HEAD:${{ github.ref_name }}"
