name: Zi Wei Sihua Admission Bundle Bridge

on:
  push:
    branches:
      - zw-p1-020-sihua-production-admission
    paths:
      - ".github/workflows/ziwei-sihua-admission-bundle-bridge.yml"

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert isolated branch lineage
        run: |
          test "$(git rev-parse HEAD^)" = "32c3d4383a4b427037f0d151cf04b7bcc5381e41"
          test "$(git branch --show-current)" = "zw-p1-020-sihua-production-admission"
      - name: Install pinned calendar build dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt
      - name: Regenerate deterministic Zi Wei bundle
        run: |
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
      - name: Run focused sihua admission and transport tests
        run: |
          python -m unittest \
            tests.test_ziwei_sihua_provider \
            tests.test_ziwei_sihua_claim_registry \
            tests.test_ziwei_sihua_admission \
            tests.test_ziwei_tool_bundle
      - name: Remove temporary bridge and enforce bounded diff
        run: |
          rm .github/workflows/ziwei-sihua-admission-bundle-bridge.yml
          rm -rf tests/__pycache__ tools/__pycache__ references/ziwei/__pycache__
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"],text=True
          ).splitlines()
          paths=[line[3:] for line in changed]
          allowed={
              ".github/workflows/ziwei-sihua-admission-bundle-bridge.yml",
              "runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json",
          }
          unexpected=[p for p in paths if p not in allowed]
          assert not unexpected, unexpected
          assert "runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json" in paths, paths
          assert ".github/workflows/ziwei-sihua-admission-bundle-bridge.yml" in paths, paths
          PY
      - name: Commit generated bundle and remove bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json .github/workflows/ziwei-sihua-admission-bundle-bridge.yml
          git commit -m "Regenerate Zi Wei bundle for sihua admission"
          git push origin HEAD:zw-p1-020-sihua-production-admission
