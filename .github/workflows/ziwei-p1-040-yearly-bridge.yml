name: Zi Wei P1-040 Yearly Interpretation Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ziwei-p1-040-yearly-bridge.yml"
      - "tools/ziwei_runtime.py"
      - "tools/ziwei_claim_retrieval.py"
      - "tools/build_ziwei_tool_bundle.py"
      - "schemas/ziwei/ZIWEI_DYNAMIC_REQUEST_V8.schema.json"
      - "schemas/ziwei/ZIWEI_DYNAMIC_RESULT_V8.schema.json"
      - "references/ziwei/ziwei_interpretation_claim_registry_yearly_v1.json"
      - "ZIWEI_YEARLY_INTERPRETATION_ADMISSION_V1.json"
      - "ZIWEI_PRODUCTION_ADMISSION_V1.json"
      - "PLAYBOOK_INDEX.json"
      - "ZIWEI.md"
      - "CHAT_INIT.md"
      - "RESEARCH_ROUTING.md"
      - "README.md"
      - "references/ziwei/README.md"
      - "references/ziwei/TEMPORAL_CONTEXT_INTERPRETATION_RESEARCH_V0.md"
      - "ZIWEI_BACKLOG.md"
      - "tests/test_ziwei_yearly_interpretation.py"
      - "tests/test_ziwei_decadal_interpretation.py"
      - "tests/test_ziwei_yearly_production.py"

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.head_ref == 'zw-p1-040-yearly-interpretation-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt
      - name: Run yearly interpretation focused regressions
        run: |
          python -m unittest \
            tests.test_ziwei_yearly_interpretation \
            tests.test_ziwei_decadal_interpretation \
            tests.test_ziwei_interpretation_retrieval_v0 \
            tests.test_ziwei_yearly_production \
            tests.test_ziwei_hourly_production \
            tests.test_ziwei_production_contract_v1
      - name: Validate yearly claim registry
        run: |
          python references/ziwei/validate_interpretation_claim_registry.py \
            references/ziwei/ziwei_interpretation_claim_registry_yearly_v1.json
      - name: Regenerate and verify generated caches
        run: |
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
          python -m unittest tests.test_ziwei_tool_bundle
          python tools/build_chatgpt_load_pack.py
          python tools/build_chatgpt_load_pack.py --check
          python tools/chatgpt_load_benchmark.py --check
      - name: Remove bridge and enforce generated-only diff
        run: |
          rm .github/workflows/ziwei-p1-040-yearly-bridge.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python - <<'PY'
          import subprocess
          paths=[x[3:] for x in subprocess.check_output(
              ["git","status","--porcelain=v1","--untracked-files=all"],text=True
          ).splitlines()]
          allowed={
              ".github/workflows/ziwei-p1-040-yearly-bridge.yml",
              "runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json",
              "CHATGPT_LOAD_PACK.json",
          }
          unexpected=[p for p in paths if p not in allowed]
          assert not unexpected, unexpected
          assert ".github/workflows/ziwei-p1-040-yearly-bridge.yml" in paths
          assert "runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json" in paths
          PY
      - name: Commit generated caches and remove bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json .github/workflows/ziwei-p1-040-yearly-bridge.yml
          git add CHATGPT_LOAD_PACK.json || true
          git commit -m "Regenerate Zi Wei caches for P1-040 yearly interpretation"
          git push origin HEAD:${{ github.head_ref }}
