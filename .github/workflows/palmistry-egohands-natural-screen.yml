name: Palmistry GTEA Hand-mask Inspect (Ephemeral)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official GTEA hand masks
        run: |
          python - <<'PY'
          import hashlib, io, json, re, zipfile
          from collections import Counter
          from pathlib import PurePosixPath
          import urllib.request

          URL = 'https://www.dropbox.com/scl/fi/c3t6f2fl420157dnteatl/hand2K_dataset.zip?rlkey=zrxsntio1npottn21gtxcxack&dl=1'
          req = urllib.request.Request(URL, headers={'User-Agent':'ai-divination-playbook-palmistry-research/1.0'})
          h = hashlib.sha256()
          buf = io.BytesIO()
          with urllib.request.urlopen(req, timeout=120) as r:
              headers = dict(r.headers.items())
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk:
                      break
                  h.update(chunk); buf.write(chunk)
          size = buf.tell(); buf.seek(0)
          with zipfile.ZipFile(buf) as z:
              names = z.namelist()
              files = [n for n in names if not n.endswith('/')]
              suffixes = Counter(PurePosixPath(n).suffix.lower() for n in files)
              topdirs = Counter(PurePosixPath(n).parts[0] if PurePosixPath(n).parts else '' for n in files)
              image_names = [n for n in files if PurePosixPath(n).suffix.lower() in {'.png','.jpg','.jpeg','.bmp'}]
              examples = image_names[:80]
          print('=== GTEA_HAND_MASK_INVENTORY ===')
          print(json.dumps({
              'status':'research-only',
              'source_page':'https://cbs.ic.gatech.edu/fpv/',
              'source_asset':'GTEA Hand Masks / hand2K_dataset.zip',
              'downloaded_bytes':size,
              'sha256':h.hexdigest(),
              'http_headers':{
                  'content_type':headers.get('Content-Type'),
                  'content_length':headers.get('Content-Length'),
                  'etag':headers.get('ETag'),
                  'last_modified':headers.get('Last-Modified'),
              },
              'zip_entry_count':len(names),
              'file_count':len(files),
              'suffix_counts':dict(suffixes),
              'top_level_counts':dict(topdirs),
              'image_count':len(image_names),
              'first_image_names':examples,
          },indent=2))
          PY
