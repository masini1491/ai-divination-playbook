name: Palmistry GTEA XML GT Screen (Ephemeral)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1'
      - name: Run XML-ground-truth natural hand screen
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, io, json, os, re, sys, urllib.request, xml.etree.ElementTree as ET, zipfile
          from collections import Counter
          from pathlib import Path, PurePosixPath
          import cv2
          import mediapipe as mp
          import numpy as np

          sys.path.insert(0, os.path.abspath('references/palmistry'))
          from association_ambiguity_probe import MODEL_URL, MODEL_SHA256, download, detect_full

          URL = 'https://www.dropbox.com/scl/fi/c3t6f2fl420157dnteatl/hand2K_dataset.zip?rlkey=zrxsntio1npottn21gtxcxack&dl=1'
          ARCHIVE_SHA = 'a64c0fcff572414fa964c5b524e989ffe2e0a6023316bf4554a0f3e24d66fb8b'
          SEQUENCE = 's2_coffee'

          req = urllib.request.Request(URL, headers={'User-Agent':'ai-divination-playbook-palmistry-research/1.0'})
          h = hashlib.sha256(); buf = io.BytesIO()
          with urllib.request.urlopen(req, timeout=120) as r:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk: break
                  h.update(chunk); buf.write(chunk)
          archive_sha = h.hexdigest()
          if archive_sha != ARCHIVE_SHA:
              raise RuntimeError(f'archive SHA mismatch: {archive_sha}')
          buf.seek(0)

          model_path = Path('hand_landmarker.task')
          model_sha = download(MODEL_URL, model_path)
          if model_sha != MODEL_SHA256:
              raise RuntimeError(f'model SHA mismatch: {model_sha}')

          def norm_label(value: str) -> str:
              return ' '.join(value.replace('_', ' ').strip().lower().split())

          def decode(z, name):
              raw = z.read(name)
              image = cv2.imdecode(np.frombuffer(raw, dtype=np.uint8), cv2.IMREAD_COLOR)
              if image is None: raise RuntimeError(f'failed to decode {name}')
              return image

          with zipfile.ZipFile(buf) as z:
              names = set(z.namelist())
              selected = []
              for xml_name in sorted(n for n in names if n.startswith('GTEA/Annotations/' + SEQUENCE + '_') and n.endswith('.xml')):
                  root = ET.fromstring(z.read(xml_name))
                  labels = [norm_label(obj.findtext('name') or '') for obj in root.findall('.//object')]
                  if 'left hand' not in labels or 'right hand' not in labels:
                      continue
                  stem = PurePosixPath(xml_name).stem
                  image_name = f'GTEA/Images/{stem}.jpg'
                  if image_name not in names:
                      raise RuntimeError(f'missing paired image for {xml_name}')
                  match = re.search(r'_([0-9]+)$', stem)
                  selected.append({'stem': stem, 'frame_id': int(match.group(1)), 'xml_labels': labels, 'image_name': image_name})

              options = mp.tasks.vision.HandLandmarkerOptions(
                  base_options=mp.tasks.BaseOptions(model_asset_path=str(model_path)),
                  running_mode=mp.tasks.vision.RunningMode.IMAGE,
                  num_hands=4,
                  min_hand_detection_confidence=0.5,
                  min_hand_presence_confidence=0.5,
                  min_tracking_confidence=0.5,
              )
              rows = []
              with mp.tasks.vision.HandLandmarker.create_from_options(options) as landmarker:
                  for item in selected:
                      image = decode(z, item['image_name'])
                      candidates = detect_full(landmarker, image)
                      rows.append({
                          'stem': item['stem'],
                          'frame_id': item['frame_id'],
                          'xml_labels': item['xml_labels'],
                          'final_candidate_count': len(candidates),
                          'handedness': [c['handedness'] for c in candidates],
                          'bbox_area_normalized': [c['bbox_area_normalized'] for c in candidates],
                          'shape_h_w': list(image.shape[:2]),
                      })

          rows.sort(key=lambda row: row['frame_id'])
          distribution = Counter(row['final_candidate_count'] for row in rows)
          transitions = []
          for left, right in zip(rows, rows[1:]):
              if left['final_candidate_count'] != right['final_candidate_count']:
                  transitions.append({
                      'from_frame_id': left['frame_id'], 'to_frame_id': right['frame_id'],
                      'from_count': left['final_candidate_count'], 'to_count': right['final_candidate_count'],
                  })
          result = {
              'status': 'research-only',
              'source_asset': 'GTEA Hand Masks / hand2K_dataset.zip',
              'archive_sha256': archive_sha,
              'sequence': SEQUENCE,
              'gt_semantics': 'direct XML object labels; selected only when both normalized Left hand and Right hand objects are present',
              'model_sha256': model_sha,
              'mediapipe_version': mp.__version__,
              'opencv_version': cv2.__version__,
              'runtime_options': {'num_hands':4,'min_hand_detection_confidence':0.5,'min_hand_presence_confidence':0.5,'min_tracking_confidence':0.5,'running_mode':'IMAGE'},
              'selected_xml_gt2_frames': len(rows),
              'final_candidate_count_distribution': {str(k):v for k,v in sorted(distribution.items())},
              'final_candidate_count_transitions_across_adjacent_selected_annotation_samples': len(transitions),
              'transitions': transitions,
              'rows': rows,
              'evidence_boundary': 'XML Left/Right object labels are source annotations; final candidate counts are post-execution HandLandmarker observations. Selected samples are annotation samples, not every source-video frame. No production threshold or routing authority follows from this study.'
          }
          print('=== GTEA_XML_GT_FULL_HANDLANDMARKER_JSON ===')
          print(json.dumps(result, indent=2))
          if len(rows) != 36:
              raise RuntimeError(f'expected 36 direct XML Left+Right s2_coffee samples, got {len(rows)}')
          if not any(row['final_candidate_count'] >= 2 for row in rows):
              raise RuntimeError('no retained >=2 final-candidate sample')
          if not any(row['final_candidate_count'] < 2 for row in rows):
              raise RuntimeError('no final-candidate loss sample')
          if not transitions:
              raise RuntimeError('no final candidate-count transition observed')
          PY
