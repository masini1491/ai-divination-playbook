name: Stochastic continuity validation bridge

on:
  push:
    branches:
      - fix/stochastic-capability-resolution-continuity

permissions:
  contents: write

jobs:
  validate-continuity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild load pack
        run: |
          python tools/build_chatgpt_load_pack.py
          python tools/build_chatgpt_load_pack.py --check
      - name: Validate targeted contracts
        run: |
          python -m unittest tests.test_behavioral_loader_selection -v
          python -m unittest tests.test_loader_contract_regression -v
          python tools/loader_contract_regression.py
          python tools/behavioral_eval.py --matrix evals/regression_matrix.json --change-class loader-optimization
          python tools/playbook_check.py .
      - name: Commit generated load pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHATGPT_LOAD_PACK.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate ChatGPT load pack for stochastic continuity"
            git push origin HEAD:fix/stochastic-capability-resolution-continuity
          fi
