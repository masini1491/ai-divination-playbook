name: One-time regenerate shared-baseline loader ranges

on:
  push:
    branches:
      - refactor/shared-development-baseline
    paths:
      - .github/workflows/regenerate-shared-baseline-ranges-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-development-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate loader ranges
        run: python tools/build_loader_ranges.py
      - name: Commit generated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAYBOOK_INDEX.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate shared-baseline loader ranges"
          git push origin HEAD:refactor/shared-development-baseline
