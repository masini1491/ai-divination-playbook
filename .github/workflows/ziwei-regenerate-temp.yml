name: Temporary Zi Wei bundle regeneration

on:
  push:
    branches:
      - refactor/ziwei-domain-path-normalization

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zi Wei calendar build dependency
        run: python -m pip install -r requirements/ziwei-calendar.txt
      - name: Regenerate and verify deterministic bundle
        run: |
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
      - name: Remove temporary workflow and commit generated artifact
        run: |
          rm .github/workflows/ziwei-regenerate-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Regenerate Zi Wei deterministic bundle"
          git push origin HEAD:${{ github.ref_name }}
