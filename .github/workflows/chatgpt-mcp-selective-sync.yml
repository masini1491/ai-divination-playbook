name: Selective ChatGPT MCP Release
on:
  push:
    branches: [main]
    paths:
      - 'runtime/casting/core.py'
      - 'tools/meihua_engine.py'
      - 'tools/liuyao_calendar.py'
      - 'tools/liuyao_engine.py'
      - 'tools/liuyao_runtime.py'
      - 'METHOD_ROUTING.md'
      - 'INPUT_CONTRACT.md'
      - 'QUESTION_DESIGN.md'
      - 'TAROT.md'
      - 'MEIHUA.md'
      - 'LIUYAO.md'
      - 'READING_LIFECYCLE.md'
      - 'READING_RECORD.md'
      - 'CROSS_VALIDATION.md'
      - 'CHATGPT_OUTPUT.md'
      - 'RUNTIME_DRAW.md'
      - 'tools/build_chatgpt_mcp_release.py'
      - 'tests/chatgpt_mcp/**'
      - 'integrations/chatgpt-mcp/app.py'
      - 'integrations/chatgpt-mcp/auto_routing.py'
      - 'integrations/chatgpt-mcp/bridge.py'
      - 'integrations/chatgpt-mcp/public_guard.py'
      - 'integrations/chatgpt-mcp/policy_adapter.py'
      - 'integrations/chatgpt-mcp/response_format.py'
      - 'integrations/chatgpt-mcp/release_profile.json'
      - 'integrations/chatgpt-mcp/requirements.txt'
      - 'integrations/chatgpt-mcp/vercel.json'
      - '.github/workflows/chatgpt-mcp-selective-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selective-chatgpt-mcp-main
  cancel-in-progress: false

jobs:
  prepare-verified-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install MCP server dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/chatgpt-mcp/requirements.txt
      - name: Validate method routing, transport, release allowlist and policy integrity
        run: python -m unittest discover -s tests/chatgpt_mcp -v
      - name: Verify existing canonical casting runtime
        run: python -m unittest discover -s tests/casting -v
      - name: Materialize allowlisted release and exact source hashes
        run: python tools/build_chatgpt_mcp_release.py
      - name: Verify deterministic release (no untracked methods)
        run: python tools/build_chatgpt_mcp_release.py --check
      - name: Publish only validated generated runtime and policy files
        run: |
          set -euo pipefail
          git add -- integrations/chatgpt-mcp/canonical-repo \
            integrations/chatgpt-mcp/source_manifest.json \
            integrations/chatgpt-mcp/source_integrity.json \
            integrations/chatgpt-mcp/policy_pack.json
          if git diff --cached --quiet; then
            echo 'No approved runtime/policy changes; no release commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mcp): refresh allowlisted verified release from canonical main'
          git push origin HEAD:main
