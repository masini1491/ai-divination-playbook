name: Selective ChatGPT MCP Release
on:
  push:
    branches: [main]
    paths:
      - 'runtime/casting/core.py'
      - 'tools/meihua_engine.py'
      - 'tools/liuyao_calendar.py'
      - 'tools/liuyao_engine.py'
      - 'tools/liuyao_runtime.py'
      - 'METHOD_ROUTING.md'
      - 'INPUT_CONTRACT.md'
      - 'QUESTION_DESIGN.md'
      - 'TAROT.md'
      - 'MEIHUA.md'
      - 'LIUYAO.md'
      - 'READING_LIFECYCLE.md'
      - 'READING_RECORD.md'
      - 'CROSS_VALIDATION.md'
      - 'CHATGPT_OUTPUT.md'
      - 'RUNTIME_DRAW.md'
      - 'tools/build_chatgpt_mcp_release.py'
      - 'tests/chatgpt_mcp/**'
      - 'integrations/chatgpt-mcp/app.py'
      - 'integrations/chatgpt-mcp/auto_routing.py'
      - 'integrations/chatgpt-mcp/bridge.py'
      - 'integrations/chatgpt-mcp/public_guard.py'
      - 'integrations/chatgpt-mcp/policy_adapter.py'
      - 'integrations/chatgpt-mcp/response_format.py'
      - 'integrations/chatgpt-mcp/release_profile.json'
      - 'integrations/chatgpt-mcp/requirements.txt'
      - 'integrations/chatgpt-mcp/vercel.json'
      - '.github/workflows/chatgpt-mcp-selective-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: selective-chatgpt-mcp-main
  cancel-in-progress: false

jobs:
  prepare-verified-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install MCP server dependencies
        run: python -m pip install --disable-pip-version-check -r integrations/chatgpt-mcp/requirements.txt
      - name: Validate method routing, transport, release allowlist and policy integrity
        run: python -m unittest discover -s tests/chatgpt_mcp -v
      - name: Verify existing canonical casting runtime
        run: python -m unittest discover -s tests/casting -v
      - name: Materialize allowlisted release and exact source hashes
        run: python tools/build_chatgpt_mcp_release.py
      - name: Verify deterministic release (no untracked methods)
        run: python tools/build_chatgpt_mcp_release.py --check
      - name: Stage generated release in isolated Draft PR, never push main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- integrations/chatgpt-mcp/canonical-repo \
            integrations/chatgpt-mcp/source_manifest.json \
            integrations/chatgpt-mcp/source_integrity.json \
            integrations/chatgpt-mcp/policy_pack.json
          if git diff --cached --quiet; then
            echo 'Generated release already matches the source; nothing to stage.'
            exit 0
          fi
          source_commit="$(git rev-parse HEAD)"
          branch="automation/mcp-release-${source_commit}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            echo "::error::Candidate ref already exists; inspect it rather than overwrite or force-push."
            exit 1
          fi
          git switch -c "${branch}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(mcp): stage verified release for ${source_commit}"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create --base main --head "${branch}" --draft \
            --title "chore(mcp): review selective release for ${source_commit:0:12}" \
            --body "Generated release candidate based on canonical source ${source_commit}. Review the generated-only diff and CI results before merging. No automatic merge or Production promotion."
          # GITHUB_TOKEN-created PRs do not automatically trigger pull_request workflows.
          # workflow_dispatch does trigger an independent validation run for this exact ref.
          gh workflow run validation.yml --ref "${branch}"
          echo "::notice::Dispatched validation for ${branch}; release PR remains Draft."
          echo "::notice::Required status checks must be attached to the candidate PR before merge."
