name: Temporary Zi Wei birthplace alias regeneration

on:
  push:
    branches:
      - fix/ziwei-birthplace-alias-and-scope-docs

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ziwei-birthplace-alias-and-scope-docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Zi Wei birthplace alias and regenerate derived artifacts
        run: |
          python -m unittest tests.test_ziwei_birthplace_timezone -v
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
          python tools/build_chatgpt_load_pack.py
          python tools/build_chatgpt_load_pack.py --check
          python tools/chatgpt_load_benchmark.py --check
          python -m unittest             tests.test_ziwei_production_contract_v1             tests.test_ziwei_materialization_discoverability -v
      - name: Commit generated artifacts and remove bridge
        run: |
          rm .github/workflows/temp-ziwei-birthplace-alias-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json CHATGPT_LOAD_PACK.json .github/workflows/temp-ziwei-birthplace-alias-regenerate.yml
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Zi Wei birthplace alias artifacts"
          git push origin HEAD:fix/ziwei-birthplace-alias-and-scope-docs
