name: Generate Liuyao deterministic bundle

on:
  push:
    branches: [feat/liuyao-deterministic-tool-bundle]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/liuyao-deterministic-tool-bundle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate deterministic bundle
        run: python tools/build_liuyao_tool_bundle.py

      - name: Commit generated bundle when changed
        run: |
          if git diff --quiet -- runtime/liuyao/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json; then
            echo "bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/liuyao/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json
          git commit -m "Generate Liuyao deterministic tool bundle [skip ci]"
          git push origin HEAD:feat/liuyao-deterministic-tool-bundle
