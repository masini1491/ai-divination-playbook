name: TEMP Generate Astrology Bundle

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'fix/ast-p0-003-transit-precision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements/astrology-provider.txt
      - run: python tools/build_astrology_core_bundle.py
      - name: Commit generated bundle when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json; then
            echo "bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json
          git commit -m "Regenerate Astrology deterministic core bundle"
          git push origin HEAD:${{ github.head_ref }}
