name: One-shot Zi Wei calendar branch archival (2026-11-04)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-ziwei-calendar-branches-20261104.yml'
permissions:
  contents: write
concurrency:
  group: one-shot-ziwei-calendar-archive-20261104
  cancel-in-progress: false
jobs:
  archive-and-retire:
    if: github.repository == 'masini1491/ai-divination-playbook' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Pin exact authorized base and final workflow-only diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: '5ffdd757717eba0d488fbe051a629974e9315b92'
          WF: '.github/workflows/archive-ziwei-calendar-branches-20261104.yml'
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "masini1491/ai-divination-playbook"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$GITHUB_SHA" | \
            jq -e --arg wf "$WF" \
              '.status == "ahead" and .ahead_by == 1 and (.files | length) == 1 and .files[0].filename == $wf and .files[0].status == "added"' >/dev/null
      - name: Fresh exact-ref and tag-vacancy preflight (no mutations)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "zw-p1-003-calendar-final-admission|068d4f3ff1bb0ab706bf6d11cdf5d44e65376f41|archive/zw-p1-003-calendar-final-admission-20261104" \
            "zw-p1-003-calendar-production-migration|c195ec235b7b8773a541485b52e0783f91c04a1a|archive/zw-p1-003-calendar-production-migration-20261104"; do
            IFS='|' read -r branch sha tag <<<"$spec"
            remote="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
            test "$remote" = "$sha"
            protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .protected)"
            test "$protected" = "false"
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >"$RUNNER_TEMP/tag-check.out"
            rc=$?
            set -e
            test "$rc" -eq 2 || { echo "::error::Archive tag $tag exists or is not verifiably absent"; exit 1; }
          done
      - name: Create both immutable archive pointers and verify their target commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "archive/zw-p1-003-calendar-final-admission-20261104|068d4f3ff1bb0ab706bf6d11cdf5d44e65376f41" \
            "archive/zw-p1-003-calendar-production-migration-20261104|c195ec235b7b8773a541485b52e0783f91c04a1a"; do
            IFS='|' read -r tag sha <<<"$spec"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$sha" --jq .ref
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
            test "$actual" = "$sha"
            echo "::notice::archive tag verified: $tag -> $sha"
          done
      - name: CAS-protected deletion of exactly two archived branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            "zw-p1-003-calendar-final-admission|068d4f3ff1bb0ab706bf6d11cdf5d44e65376f41|archive/zw-p1-003-calendar-final-admission-20261104" \
            "zw-p1-003-calendar-production-migration|c195ec235b7b8773a541485b52e0783f91c04a1a|archive/zw-p1-003-calendar-production-migration-20261104"; do
            IFS='|' read -r branch sha tag <<<"$spec"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$sha"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)" = "$sha"
            git push --force-with-lease="refs/heads/$branch:$sha" origin ":refs/heads/$branch"
            echo "::notice::deleted by this job (exact SHA lease): refs/heads/$branch at $sha"
            set +e
            git ls-remote --exit-code --heads origin "refs/heads/$branch" >"$RUNNER_TEMP/branch-check.out"
            rc=$?
            set -e
            test "$rc" -eq 2 || { echo "::error::Branch $branch is not verifiably absent"; exit 1; }
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$sha"
          done
          echo "::notice::both archive refs verified and both branches retired; no Releases were created"
