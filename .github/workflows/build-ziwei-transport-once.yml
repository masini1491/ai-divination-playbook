name: Build Zi Wei deterministic transport bundle

on:
  push:
    branches:
      - production/ziwei-transport-v1

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'Build Zi Wei transport')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/ziwei-transport-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Zi Wei dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ziwei-calendar.txt
      - name: Generate and verify bundle
        run: |
          python tools/build_ziwei_tool_bundle.py
          python tools/build_ziwei_tool_bundle.py --check
      - name: Commit generated bundle and remove bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-ziwei-transport-once.yml
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json
          git commit -m "Generate Zi Wei deterministic transport bundle"
          git push origin HEAD:production/ziwei-transport-v1
