name: One-shot Zi Wei unified runtime bundle regeneration

on:
  push:
    branches:
      - feat/ziwei-unified-runtime-v1

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ziwei-unified-runtime-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ziwei-calendar.txt
      - run: python tools/build_ziwei_tool_bundle.py
      - name: Verify generated bundle
        run: python tools/build_ziwei_tool_bundle.py --check
      - name: Commit generated artifact and remove bridge
        shell: bash
        run: |
          rm .github/workflows/ziwei-unified-runtime-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/ziwei/CHATGPT_DETERMINISTIC_TOOL_BUNDLE.json .github/workflows/ziwei-unified-runtime-regenerate.yml
          git diff --cached --exit-code && { echo "Expected generated changes were absent"; exit 1; } || true
          git commit -m "Regenerate Zi Wei unified runtime bundle"
          git push origin HEAD:feat/ziwei-unified-runtime-v1
