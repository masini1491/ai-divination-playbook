name: TEMP Astrology Real Connect Materialization
on:
  pull_request:
    paths:
      - ".github/workflows/temp-astrology-real-connect.yml"
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check geonamescache==3.0.2
      - name: Emit bounded real shards for connector commit
        run: |
          python tools/generate_astrology_place_shards.py --profiles 15000 --write --output /tmp/place-v1 >/tmp/generation.json
          python - <<'PY'
          import base64,hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          import generate_astrology_place_shards as g
          root=Path("/tmp/place-v1")
          key="樹林區".casefold()
          abid=g.alias_bucket_id(key)
          alias=g.shard_path(root,15000,"aliases",abid)
          routes=json.loads(alias.read_text())["aliases"][key]
          gid=int(routes[0][0]); cbid=g.candidate_bucket_id(gid)
          candidate=g.shard_path(root,15000,"candidates",cbid)
          for label,p in [("ALIAS",alias),("CANDIDATE",candidate)]:
              raw=p.read_bytes()
              print(f"PROBE_{label}_PATH={p.relative_to(root).as_posix()}")
              print(f"PROBE_{label}_SHA256={hashlib.sha256(raw).hexdigest()}")
              print(f"PROBE_{label}_BYTES={len(raw)}")
              print(f"PROBE_{label}_B64={base64.b64encode(raw).decode()}")
          print("PROBE_EXPECTED_GID="+str(gid))
          PY
