name: Palmistry Upstream Multi-hand Probe (Ephemeral)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MediaPipe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2
          python -m pip install --upgrade pip
          python -m pip install 'mediapipe==1.0.1'
      - name: Run upstream multi-hand fixture study
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('references/palmistry').resolve()))
          import cv2
          import mediapipe as mp
          import mediapipe_repeatability_runner as runner

          UPSTREAM_REV = '8dd04551858308f3003ace87632d7308d6a62212'
          IMAGE_URL = 'https://storage.googleapis.com/mediapipe-assets/tasks/testdata/vision/right_hands.jpg?generation=1782185275057115'
          IMAGE_SHA = '4b5134daa4cb60465535239535f9f74c2842aba3aa5fd30bf04ef5678f93d87f'
          MODEL_SHA = 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1'
          root = Path('palmistry-upstream-multihand-output')
          root.mkdir(parents=True, exist_ok=True)
          model_path = root / 'hand_landmarker.task'
          model_sha = runner.download(runner.MODEL_URL, model_path)
          if model_sha != MODEL_SHA:
              raise RuntimeError(f'model sha mismatch: {model_sha}')

          config = {
              'label': 'Case C — MediaPipe upstream right_hands.jpg',
              'source_page': f'https://github.com/google-ai-edge/mediapipe/blob/{UPSTREAM_REV}/mediapipe/tasks/python/test/vision/hand_landmarker_test.py',
              'image_url': IMAGE_URL,
              'license': 'MediaPipe tasks/testdata/vision BUILD: notice / Apache-2.0; asset-specific authorship provenance not separately documented',
          }
          options = mp.tasks.vision.HandLandmarkerOptions(
              base_options=mp.tasks.BaseOptions(model_asset_path=str(model_path)),
              running_mode=mp.tasks.vision.RunningMode.IMAGE,
              num_hands=2,
              min_hand_detection_confidence=0.5,
              min_hand_presence_confidence=0.5,
              min_tracking_confidence=0.5,
          )
          with mp.tasks.vision.HandLandmarker.create_from_options(options) as landmarker:
              runner.run_case('case_c', config, landmarker, model_sha, root)

          provenance = json.loads((root / 'case_c' / 'provenance.json').read_text(encoding='utf-8'))
          if provenance['source_sha256'] != IMAGE_SHA:
              raise RuntimeError(f'fixture sha mismatch: {provenance["source_sha256"]}')
          if provenance['baseline_candidate_count'] < 2:
              raise RuntimeError(f'expected >=2 baseline candidates, got {provenance["baseline_candidate_count"]}')
          variant_counts = {name: meta['candidate_count'] for name, meta in provenance['variant_metadata'].items()}
          second_best_present = {
              name: (meta['match']['second_best_mean_anchor_distance_fraction'] is not None)
              for name, meta in provenance['variant_metadata'].items()
          }
          print('=== UPSTREAM_MULTIHAND_ASSERTIONS ===')
          print(json.dumps({
              'upstream_revision': UPSTREAM_REV,
              'fixture_sha256_verified': True,
              'model_sha256_verified': True,
              'baseline_candidate_count': provenance['baseline_candidate_count'],
              'baseline_all_candidates': provenance['baseline_all_candidates'],
              'variant_candidate_counts': variant_counts,
              'second_best_present': second_best_present,
          }, indent=2))
          PY
