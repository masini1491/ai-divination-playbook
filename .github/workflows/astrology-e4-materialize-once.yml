name: Astrology E4 one-time materialization

on:
  push:
    branches: [astrology-e4-adm-1]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Astrology provider dependency
        run: python -m pip install --disable-pip-version-check -r requirements-astrology-provider.txt

      - name: Rebuild deterministic core bundle
        run: python tools/build_astrology_core_bundle.py

      - name: Run E4 targeted regression
        run: >-
          python -m unittest
          tests.test_astrology_provider
          tests.test_astrology_evidence_selector
          tests.test_astrology_evidence_selector_contract
          tests.test_astrology_production_contract
          tests.test_astrology_core_tool_bundle

      - name: Remove one-time workflow and verify final candidate
        shell: bash
        run: |
          rm .github/workflows/astrology-e4-materialize-once.yml
          python tools/build_astrology_core_bundle.py --check
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/astrology-e4-materialize-once.yml",
              "runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD"], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f"unexpected one-time bridge diff: {sorted(changed)}")
          PY

      - name: Commit generated artifact and retire bridge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/astrology/CHATGPT_DETERMINISTIC_CORE_BUNDLE.json .github/workflows/astrology-e4-materialize-once.yml
          git commit -m "Regenerate Astrology core bundle for E4"
          git push origin "HEAD:${{ github.ref_name }}"
